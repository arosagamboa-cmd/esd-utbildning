const COURSE = {
  sv: {
    modules: [
      {
        id: "m1",
        title: "Modul 1: Introduktion till ESD",
        icon: "spark",
        recap: [
          "ESD är en plötslig laddningsutjämning mellan två objekt med olika elektrisk potential – skadan kan vara osynlig och synas först långt senare.",
          "Laddning byggs upp av friktion mellan material eller av ett laddat föremål i närheten, t.ex. golv, stolar, förpackning och ojordade verktyg.",
          "Material delas in i tre klasser: ledande, statisk-avledande och isolerande – statisk-avledande är oftast bäst för arbetsytor och förpackning.",
          "Latenta fel är farligare än katastrofala fel – de upptäcks ofta först hos kund.",
          "Den standardiserade varningssymbolen (triangel, hand, kryss) visar att en artikel är ESD-känslig."
        ],
        sections: [
          { icon: "spark", diagram: "esdPhoto", heading: "Vad är elektrostatisk urladdning (ESD)?", body: `<p>Elektrostatisk urladdning (ESD) är när elektrisk laddning plötsligt hoppar mellan två föremål – antingen när de rör vid varandra, eller när de kommer tillräckligt nära för att laddningen ska hoppa som en liten gnista. Det kan hända mellan en person och en komponent, mellan två komponenter, eller mellan en maskin och en komponent.</p><p>Vi människor känner oftast inte av en urladdning förrän den är cirka 3000 volt stark. Men känslig elektronik kan skadas redan vid 100 volt – långt innan du själv skulle märka något alls.</p><p>Skadan syns inte alltid direkt. En komponent kan verka fungera helt normalt men vara försvagad, och sluta fungera först långt senare – ofta hos kunden. Det är därför ESD är farligt även när du inte känner eller ser något hända.</p>` },
          { icon: "spark", diagram: "tribo", heading: "Vad orsakar statisk laddning?", body: `<p>Statisk laddning byggs upp när två material gnids mot varandra och sedan skiljs åt – till exempel när du går på golvet, reser dig från en stol med syntetiskt tyg, eller hanterar en plastpåse. Ett laddat föremål kan också påverka en komponent på avstånd, utan direkt kontakt, om det kommer tillräckligt nära.</p><p>Vanliga källor på en arbetsplats är golv och skor, stolar med syntetiskt tyg, förpackningsmaterial som bubbelplast och plastpåsar, samt ojordade verktyg och vagnar. Låg luftfuktighet gör att laddningen byggs upp lättare och avleds långsammare.</p>` },
          { icon: "materials", diagram: "condVsIns", heading: "Ledande, statisk-avledande och isolerande material", body: `<p>Material delas grovt in i tre grupper utifrån hur bra de leder bort laddning. <strong>Ledare</strong> (t.ex. metallverktyg, pincetter och människokroppen) släpper igenom elektroner fritt, så laddning jämnas ut nästan direkt. <strong>Isolatorer</strong> (t.ex. plastflaskor, tejprullar och frigolitmuggar) håller kvar laddningen under lång tid och går inte att jorda bort. <strong>Statisk-avledande material</strong> ligger mellan de två och är oftast bäst för arbetsytor, mattor och förpackningar – de leder bort laddning lugnt och kontrollerat, istället för snabbt och okontrollerat som en ren ledare kan göra.</p>` },
          { icon: "label", diagram: "esdSymbol", heading: "Varningssymbolen och varför skador kan vara osynliga", body: `<p>En ESD-skada kan vara <strong>katastrofal</strong> – komponenten slutar fungera direkt och felet upptäcks vid test – eller <strong>latent</strong>, vilket är farligare: komponenten skadas bara delvis och fortsätter fungera till en början, för att sedan fela långt senare, ofta hos kunden.</p><p>ESD-känsliga artiklar (ESDS) märks med en standardiserad varningssymbol – en triangel med en hand och ett kryss. Symbolen visar att artikeln bara får hanteras inom ESD-skyddade förhållanden: jordad personal, jordad arbetsyta och ESD-säker förpackning.</p>` }
        ],
        questions: [
          { text: "Vad är elektrostatisk urladdning (ESD)?", options: ["En plötslig överföring av statisk elektricitet mellan två objekt med olika elektrisk potential","En typ av magnetisk störning som påverkar kretskort","En metod för att jorda elektroniska komponenter","En kemisk reaktion som uppstår vid lödning"], correct: 0, explanation: "ESD är en plötslig utjämning av laddning mellan två objekt med olika elektrisk potential.", notes: ["", "ESD handlar om elektrisk laddning, inte magnetism.", "Jordning är en skyddsåtgärd mot ESD, inte definitionen av ESD.", "ESD har inget med lödning eller kemiska reaktioner att göra."] },
          { text: "Vad orsakar oftast en elektrostatisk urladdning på en arbetsplats?", options: ["Friktion mellan olika material (triboelektrisk effekt)","Höga temperaturer i lokalen","Elektromagnetiska fält från verktyg","Fukt i luften"], correct: 0, explanation: "Triboelektrisk laddning genom friktion/kontakt och separation är den vanligaste orsaken.", notes: ["", "Temperatur i sig orsakar inte ESD, även om torr luft kan förvärra det.", "Detta är en annan typ av störning, inte den vanligaste ESD-orsaken.", "Fukt motverkar snarare uppladdning – låg fukt är problemet, inte hög."] },
          { text: "Vad innebär triboelektrisk laddning?", options: ["Laddning som uppstår när två material kommer i kontakt och sedan separeras","Laddning som uppstår enbart vid blixtnedslag","Laddning som genereras av batterier","Laddning som automatiskt neutraliseras av jordning"], correct: 0, explanation: "Triboelektrisk laddning bildas just vid kontakt och separation mellan material.", notes: ["", "Blixtnedslag är ett annat, mycket kraftigare fenomen.", "Batterier alstrar ström genom kemiska reaktioner, inte friktion.", "Jordning avleder laddning, men det är inte det triboelektrisk laddning beskriver."] },
          { text: "Vad är skillnaden mellan ledande och isolerande material?", options: ["Ledande material tillåter laddning att röra sig fritt, isolerande material håller kvar laddningen","Isolerande material leder alltid elektricitet bättre än ledande material","Det finns ingen praktisk skillnad för ESD-kontroll","Ledande material kan aldrig bli statiskt laddade"], correct: 0, explanation: "Ledande material kan jordas för att avleda laddning, isolerande material håller kvar den.", notes: ["", "Det är tvärtom – isolerande material håller kvar laddning istället för att leda den.", "Skillnaden är själva grunden för hur ESD-kontroll fungerar.", "Även ledande material kan laddas upp om de inte är jordade."] },
          { text: "Vilket av följande är ett exempel på en ledare i vardagen?", options: ["En metallpincett", "En plastflaska", "En tejprulle", "En frigolitmugg"], correct: 0, explanation: "Metallverktyg som pincetter släpper igenom elektroner fritt och är därför ledare.", notes: ["", "En plastflaska är en isolator som håller kvar laddning.", "En tejprulle är en isolator som håller kvar laddning.", "En frigolitmugg är en isolator som håller kvar laddning."] },
          { text: "Vad kännetecknar ett latent fel orsakat av ESD, till skillnad från ett katastrofalt fel?", options: ["Komponenten slutar fungera direkt och felet upptäcks vid test","Komponenten skadas delvis men fungerar till en början, och kan fela senare i fält","Felet upptäcks alltid direkt vid produktion","Latenta fel påverkar bara förpackningen, inte komponenten"], correct: 1, explanation: "Latenta fel är särskilt allvarliga eftersom de ofta upptäcks först hos slutkund.", notes: ["Det beskriver ett katastrofalt fel, inte ett latent.", "", "Latenta fel är just sådana som inte upptäcks direkt.", "Latenta fel handlar om skada på själva komponenten."] },
          { text: "Vad kallas material med ett motstånd mellan ledande och isolerande, som leder bort laddning kontrollerat och långsamt?", options: ["Superledare","Statisk-avledande (dissipative) material","Halvledare","Antimagnetiskt material"], correct: 1, explanation: "Statisk-avledande material ligger resistansmässigt mellan ledare och isolatorer och avleder laddning kontrollerat.", notes: ["Superledare är ett fysikaliskt begrepp för nära noll resistans, inte detta.", "", "Halvledare är en materialklass inom elektronik, inte en ESD-resistanskategori.", "Magnetism är inte det som avgör hur laddning leds bort."] },
          { text: "Hur känner man igen att en artikel är ESD-känslig (ESDS)?", options: ["Genom en standardiserad varningssymbol med en triangel, hand och kryss på artikel/förpackning","Artikeln är alltid gul till färgen","Det går inte att se, man måste gissa","Endast genom att artikeln känns tung"], correct: 0, explanation: "Den standardiserade ESD-varningssymbolen markerar känsliga artiklar och förpackningar.", notes: ["", "Färg säger inget om ESD-känslighet.", "Den standardiserade symbolen gör det möjligt att se det direkt.", "Vikt har inget med ESD-känslighet att göra."] },
          { text: "En komponent klarar alla funktionstester på fabriken men slutar fungera hos kunden tre månader senare. Efteråt upptäcks att en operatör kort rörde komponenten utan jordning strax innan den paketerades. Vad är den mest troliga förklaringen?", options: ["Ett latent fel — komponenten skadades delvis av ESD men fortsatte fungera till en början", "Ett katastrofalt fel — komponenten slutade fungera direkt", "EOS — felaktig spänning eller ström vid test", "Inget samband med ESD, eftersom komponenten klarade alla tester på fabriken"], correct: 0, explanation: "Det här är ett typexempel på ett latent fel: komponenten skadades delvis av en ESD-händelse men fungerade till en början, för att sedan fela långt senare hos kunden.", notes: ["", "Ett katastrofalt fel hade upptäckts direkt vid test på fabriken, inte tre månader senare hos kunden.", "Inget tyder på felaktig testspänning eller ström — scenariot beskriver en ogrundad kontakt, alltså statisk urladdning.", "Att komponenten klarade fabrikstesterna är precis det som gör latenta fel så farliga — skadan syns inte direkt."] },
          { text: "Vilket av följande är INTE en typisk källa till statisk laddning på en arbetsplats?", options: ["En jordad ESD-matta", "Att gå på golv med isolerande skor", "Bubbelplast och vanliga plastpåsar", "Att resa sig från en stol med syntetiskt tyg"], correct: 0, explanation: "En jordad ESD-matta är tvärtom till för att avleda laddning – det är en skyddsåtgärd, inte en laddningskälla.", notes: ["", "Isolerande skor mot golv är en vanlig laddningskälla.", "Bubbelplast och plastpåsar är vanliga isolerande förpackningsmaterial som kan laddas upp.", "Att resa sig från en stol med syntetiskt tyg är ett klassiskt exempel på triboelektrisk laddning."] }
        ]
      },
      {
        id: "m2",
        title: "Modul 2: Hur operatörer förebygger och kontrollerar ESD",
        icon: "wriststrap",
        recap: [
          "Jordning ger operatör och arbetsyta samma potential, så laddning leds bort säkert.",
          "Handledsrem används vid stillasittande arbete (mot bar hud); ESD-skor/skoband används vid rörelse (kräver ett ledande golv).",
          "All jordningsutrustning på en station ska anslutas till samma gemensamma jordpunkt – annars kan en liten potentialskillnad orsaka en urladdning.",
          "Jordningsutrustning testas varje skift med en testare – grönt betyder godkänt, rött betyder att utrustningen ska kontrolleras eller bytas.",
          "Håll kretskort i kanten/hörnet och komponenter i höljet – aldrig i benen (leads). Ett ojordat metallföremål (isolerad ledare) kan vara farligare än isolerande material."
        ],
        sections: [
          { icon: "wriststrap", diagram: "groundWalk", heading: "Jordning — armband och skor", body: `<p>Jordning kopplar operatören, arbetsytan och utrustningen till en gemensam jordpotential, så statisk laddning leds bort säkert istället för att urladdas okontrollerat genom en komponent. Även att bara sitta still och röra armarna kan ladda upp kroppen med flera hundra volt.</p><ul><li><strong>Handledsrem</strong> – ansluts runt handleden till en jordpunkt och används vid stillasittande arbete vid bänken. Ska sitta mot bar hud, inte över kläder.</li><li><strong>ESD-skor</strong> eller <strong>skoband/hälband</strong> – leder bort laddning genom sulan till ett ledande golv, och används vid arbete i rörelse. Fungerar bara tillsammans med ett ledande golv, och skoband bör helst sitta på båda fötterna.</li></ul><p>All jordningsutrustning på en station – handledsrem, bänkmatta, stol – ska anslutas till <strong>samma gemensamma jordpunkt</strong>. Annars kan en liten potentialskillnad mellan olika jordpunkter räcka för att orsaka en urladdning, trots att allt formellt är jordat.</p>` },
          { icon: "monitor", diagram: "tester", heading: "Testa utrustningen varje dag", body: `<p>Jordningsutrustning ska testas varje skift, eller varje gång du går in i ett ESD-skyddat område. Använd en testare: håll handledsremmen mot testarens platta, eller ställ dig på fotplattorna för skotest. Grön lampa betyder godkänt, röd betyder att utrustningen måste kontrolleras eller bytas innan arbetet fortsätter.</p><p>Gör också en snabb egenkontroll varje skift: att handledsremmen sitter rätt och är hel, att skorna fungerar mot golvet, och att arbetsytan är fri från isolerande föremål som plastmuggar och papper. Rapportera avvikelser direkt till skiftledaren.</p>` },
          { icon: "box", diagram: "handling", heading: "Hantera komponenter rätt", body: `<p>Håll kretskort i kanten eller hörnet, och komponenter i höljet – aldrig i benen (leads). Hantera artiklar så lite som möjligt, förvara och transportera dem i ESD-säker förpackning, och lägg dem aldrig direkt på en vanlig, icke ESD-säker yta.</p><p>Var extra uppmärksam på <strong>ojordade metallföremål</strong> – till exempel ett verktyg eller en vagn. De kallas isolerade ledare och kan bygga upp en hög laddning som sedan laddas ur på en gång, ofta snabbare och mer skadligt än isolerande material. Kontrollera alltid att metallföremål på arbetsytan är jordade.</p>` },
          { icon: "smock", diagram: "smock", heading: "ESD-klädsel", body: `<p>En ESD-rock i statisk-avledande material hindrar vanliga kläder från att bli en okontrollerad laddningskälla. Den fungerar bara om den bärs hopknäppt med åtsittande manschetter mot handlederna – en öppen rock bryter den ledande ytan och skyddet uteblir.</p><p>Stolar i ESD-området ska ha statisk-avledande klädsel och vara kopplade till samma gemensamma jordpunkt som övrig utrustning. Undvik personliga isolerande föremål som smycken och plastmuggar nära känsliga artiklar.</p>` }
        ],
        questions: [
          { text: "Vad är syftet med jordning (grounding) på en ESD-säker arbetsplats?", options: ["Att ge operatören och arbetsytan samma elektriska potential som jord, så laddning leds bort säkert","Att öka den statiska laddningen på komponenter för att testa dem","Att isolera operatören helt från arbetsbänken","Att förhindra att verktyg leder ström"], correct: 0, explanation: "Jordning utjämnar potentialen mellan operatör, bänk och komponent.", notes: ["", "Syftet är motsatsen – att avleda laddning, inte öka den.", "Jordning kopplar samman, inte isolerar, operatör och bänk.", "Jordning handlar om att leda bort laddning, inte hindra ledningsförmåga."] },
          { text: "Hur ofta och på vilket sätt bör en ESD-handledsrem testas för att säkerställa korrekt funktion?", options: ["Aldrig, det räcker att sätta på den","Endast vid inköp av ny utrustning","Dagligen/vid varje skift, med en avsedd testare som kontrollerar resistansvärdet","En gång per år vid en extern revision"], correct: 2, explanation: "Daglig testning med en avsedd testare säkerställer att utrustningen faktiskt fungerar.", notes: ["Utrustning kan sluta fungera utan att det syns – testning krävs.", "Slitage kan göra att remmen slutar fungera senare.", "", "Det är alldeles för sällan – dagligt bruk kräver daglig kontroll."] },
          { text: "Hur ska ESD-känsliga komponenter (ESDS) hanteras och transporteras korrekt?", options: ["I vanliga plastpåsar utan märkning","I ESD-skyddande förpackning och endast inom en ESD-skyddad zon eller med jordad transportutrustning","Fritt i fickan under transport mellan stationer","Det spelar ingen roll så länge komponenten inte tappas"], correct: 1, explanation: "ESDS-artiklar kräver ESD-säker förpackning och jordad hantering/transport genomgående.", notes: ["Vanliga plastpåsar är isolerande och skyddar inte mot ESD.", "", "Det ger varken skärmning eller jordad hantering.", "ESD-skador syns inte alltid direkt, oavsett om komponenten tappas."] },
          { text: "Vad kallas ett ojordat metallföremål, till exempel ett verktyg, som kan hålla kvar och plötsligt ladda ur en hög laddning?", options: ["En statisk-avledande enhet","En isolerad ledare","En jordbunden komponent","En ESD-neutral artikel"], correct: 1, explanation: "En isolerad ledare är ett ledande föremål utan jordning, vilket gör det till en dold risk.", notes: ["Statisk-avledande material är en avsiktlig skyddsegenskap, inte detta.", "", "Jordbunden betyder just att den ÄR jordad, vilket är motsatsen.", "Ett ojordat metallföremål är tvärtom en risk, inte neutralt."] },
          { text: "Varför kan en isolerad ledare vara mer skadlig än många isolerande material vid en ESD-händelse?", options: ["Hela laddningen kan laddas ur på en gång, snabbt och kraftfullt","Isolerade ledare laddas aldrig upp","De påverkar bara förpackningen","De är alltid jordade per automatik"], correct: 0, explanation: "Ledande material utan jordning kan ge en mycket snabb och kraftfull urladdning.", notes: ["", "Det är tvärtom – de kan bygga upp hög laddning.", "Risken gäller direktkontakt med komponenten, inte bara förpackning.", "Just avsaknaden av jordning är det som gör dem farliga."] },
          { text: "Vad är syftet med en ESD-rock/smock i statisk-avledande material?", options: ["Att göra operatören varmare","Att se professionell ut","Att förhindra att vanliga, isolerande kläder laddar upp operatören","Att ersätta handledsremmen helt"], correct: 2, explanation: "ESD-klädsel förhindrar att vanliga kläder blir en okontrollerad laddningskälla.", notes: ["Komfort är inte syftet, skyddet mot laddning är.", "Utseendet är en bieffekt, inte syftet.", "", "Smockan kompletterar, men ersätter inte, handledsremmen."] },
          { text: "Vad bör en operatör göra som en del av sin dagliga egenkontroll?", options: ["Endast kontrollera att belysningen fungerar","Kontrollera handledsrem, skor/golv och att arbetsytan är fri från otillåtna isolerande material","Vänta på nästa schemalagda revision, ingen daglig kontroll behövs","Byta ut hela arbetsstationen varje dag"], correct: 1, explanation: "Daglig egenkontroll av utrustning och arbetsyta är operatörens eget ansvar.", notes: ["Belysning är inte kopplat till ESD-egenkontroll.", "", "Daglig kontroll är just det som kompletterar de schemalagda revisionerna.", "Det är varken rimligt eller nödvändigt – kontroll räcker."] },
          { text: "En operatör sätter på sig sin handledsrem varje morgon men testar den inte den dagen, eftersom den \"fungerade bra igår\". Senare visar det sig att en komponent skadats av ESD vid operatörens station. Vad var operatörens huvudsakliga misstag?", options: ["Att inte testa handledsremmen dagligen/vid varje skift innan användning", "Att använda handledsrem istället för skoband", "Att bära handledsremmen över en tröjärm", "Att inte bära hörselskydd vid stationen"], correct: 0, explanation: "Jordningsutrustning kan sluta fungera utan att det syns eller känns, därför krävs daglig testning med en avsedd testare — det räcker inte att den fungerade dagen innan.", notes: ["", "Handledsrem och skoband fyller olika syften och det ena ersätter inte kravet på daglig testning.", "Att bära remmen över kläder är också fel, men det beskrivs inte i scenariot — problemet här är den uteblivna testningen.", "Hörselskydd har inget med ESD-kontroll att göra."] },
          { text: "Varför måste all jordningsutrustning vid en arbetsstation – handledsrem, bänkmatta, stol – anslutas till samma gemensamma jordpunkt?", options: ["Annars kan en liten potentialskillnad mellan olika jordpunkter orsaka en elektrostatisk urladdning, trots att allt är jordat", "Det är bara en praktisk fråga om kabellängd, ingen säkerhetsrisk", "Flera jordpunkter ger snabbare avledning av laddning", "Det krävs enbart för att uppfylla brandskyddsregler"], correct: 0, explanation: "Två saker kan var för sig vara korrekt jordade men ändå ha en liten potentialskillnad om de går till olika jordpunkter – den skillnaden kan räcka för att orsaka en urladdning när de rör vid samma komponent.", notes: ["", "Det handlar om en verklig ESD-risk, inte bara kabeldragning.", "Fler jordpunkter ger tvärtom risk för potentialskillnader, inte snabbare avledning.", "Det är en ESD-skyddsåtgärd, inte en brandskyddsfråga."] },
          { text: "Hur bör man hålla i ett kretskort respektive en enskild komponent för att minska risken för ESD-skada?", options: ["Kretskort i kanten/hörnet, komponenter i höljet – aldrig i benen (leads)", "Det spelar ingen roll var man håller, bara man är jordad", "Kretskort i mitten där komponenterna sitter, för bättre grepp", "Komponenter i benen, för att undvika att röra vid höljet"], correct: 0, explanation: "Att hålla kretskort i kanten och komponenter i höljet minskar risken för både ESD-skada och fysisk skada på de känsliga benen.", notes: ["", "Rätt greppteknik minskar risken ytterligare, även för en jordad operatör.", "Det ökar risken att skada eller ladda upp komponenterna direkt.", "Benen är känsligast och böjs lättast – de ska undvikas, inte användas som greppyta."] }
        ]
      },
      {
        id: "m3",
        title: "Modul 3: Hur anläggningar förebygger och kontrollerar ESD",
        icon: "building",
        recap: [
          "Ett EPA kräver kontrollerade material, jordning och rutiner i hela området – även besökare måste jordas.",
          "ESD-mattan ansluts till den gemensamma jordpunkten; nödvändiga isolerande material ska hållas minst 30 cm från ESD-känsliga artiklar.",
          "Avskärmande förpackning blockerar yttre fält; dissipativ förpackning ('rosa poly') leder bort laddning men skyddar inte mot källor utanför förpackningen.",
          "ESD-golv fungerar bara tillsammans med rätt ESD-skor – båda krävs tillsammans.",
          "Personer utan ESD-utbildning ska eskorteras av utbildad personal i ett EPA."
        ],
        sections: [
          { icon: "building", diagram: "epa", heading: "ESD-skyddade områden (EPA)", body: `<p>Ett EPA (ESD Protected Area) är ett avgränsat område där alla ytor, material, utrustning och rutiner är utformade för att kontrollera statisk elektricitet – jordade bänkar och golv, kontrollerad luftfuktighet, tydlig skyltning och krav på att all personal som går in är jordad.</p><p>Inom ett EPA behandlas alla elektroniska artiklar som ESD-känsliga, oavsett om de är märkta eller inte – en medveten säkerhetsmarginal. Även tillfälliga besökare måste jordas, till exempel med en tillfällig handledsrem, och den som saknar ESD-utbildning ska eskorteras av utbildad personal.</p>` },
          { icon: "fan", diagram: "workstationTools", heading: "Arbetsstationen: matta, sladd och förpackning", body: `<p>Arbetsstationen ska ha en ESD-matta på bänk och/eller golv, ansluten till en gemensam jordpunkt, samt anti-statiska verktyg (t.ex. skruvmejslar med jordningssladd). Onödiga isolerande föremål som vattenflaskor och frigolitmuggar tas bort helt. Isolerande material som ändå behövs för arbetet ska hållas minst 30 cm från ESD-känsliga artiklar.</p><p>Vid förvaring och transport används ESD-säker förpackning: <strong>avskärmande</strong> påsar (metalliserade, helt förslutna) blockerar yttre elektriska fält, medan <strong>dissipativ</strong> förpackning ("rosa poly") leder bort laddning kontrollerat men inte skyddar mot laddning utanför förpackningen. Vanlig bubbelplast och omärkta plastpåsar ska aldrig användas för ESD-känsliga artiklar.</p>` },
          { icon: "shoe", diagram: "floorShoes", heading: "Golv och skor tillsammans", body: `<p>Golvet är en av de viktigaste jordningsvägarna för personal i rörelse, men fungerar bara tillsammans med rätt ESD-skor eller skoöverdrag – det ena utan det andra ger ingen jordning. Golvmaterialet har inbyggda ledande fibrer som leder laddningen vidare till jordanslutningar i golvet, kopplade till anläggningens gemensamma jordpunkt.</p>` }
        ],
        questions: [
          { text: "Vad är ett ESD-skyddat område (EPA)?", options: ["Ett område med särskilt utformade material, jordning och rutiner för att kontrollera statisk elektricitet","Ett lager för färdiga produkter utan särskilda krav","Ett kontor utan elektronisk utrustning","Ett område där mobiltelefoner är förbjudna"], correct: 0, explanation: "Ett EPA definieras av kontrollerade material, jordning och rutiner.", notes: ["", "Ett EPA kräver tvärtom särskilt utformade material och rutiner.", "Det handlar om kontrollerad statisk elektricitet, inte frånvaro av utrustning.", "Mobilförbud är inte det som definierar ett EPA."] },
          { text: "Vad bör göras med isolerande föremål som inte behövs för arbetet, t.ex. en vattenflaska eller en frigolitmugg, på en ESD-säker arbetsstation?", options: ["De ska tas bort helt från arbetsstationen", "De är ofarliga så länge de inte rör vid komponenten direkt", "De behöver bara flyttas till andra sidan av rummet", "En statisk-avledande matta gör dem ofarliga oavsett avstånd"], correct: 0, explanation: "Onödiga isolerande föremål ska tas bort helt, eftersom de kan bygga upp laddning och påverka närliggande komponenter även utan direkt kontakt.", notes: ["", "Ett laddat föremål kan påverka komponenter i närheten utan direkt kontakt, genom induktion.", "Att bara flytta dem räcker inte om de fortfarande finns kvar på arbetsstationen.", "Även med en avledande matta kvarstår risken om ett laddat föremål ligger för nära."] },
          { text: "Ett isolerande material behövs för själva arbetsmomentet och kan inte tas bort helt från arbetsstationen. Hur långt ifrån ESD-känsliga artiklar bör det ändå hållas?", options: ["Minst 30 cm", "Det spelar ingen roll så länge det inte rör artikeln", "Minst 2 meter", "Det räcker att det står på en statisk-avledande matta"], correct: 0, explanation: "Isolerande material som faktiskt behövs för arbetet bör hållas minst 30 cm från ESD-känsliga artiklar, eftersom även en statisk-avledande matta inte kan garantera skydd om ett laddat föremål ligger för nära.", notes: ["", "Ett laddat föremål på nära håll kan påverka en komponent utan direkt kontakt, genom induktion.", "30 cm räcker – 2 meter är inte det angivna avståndet.", "En avledande matta minskar inte risken om det laddade föremålet ligger för nära artikeln."] },
          { text: "En operatör behöver lägga ner en laddad komponent under montering. Ett bord är gjort av vanlig blank metall utan ESD-behandling, ett annat är en statisk-avledande ESD-bänk. Vilket bord är det bättre valet?", options: ["Den statisk-avledande ESD-bänken, eftersom den leder bort laddningen långsamt och säkert", "Metallbordet, eftersom metall alltid leder bäst", "Det spelar ingen roll så länge komponenten läggs ner försiktigt", "Metallbordet, om det bara står på ett ESD-golv"], correct: 0, explanation: "En statisk-avledande yta leder bort laddning kontrollerat och långsamt, medan en helt ledande yta som obehandlad metall kan få laddningen att hoppa över snabbt och okontrollerat – vilket i sig kan orsaka en ESD-händelse.", notes: ["", "Ren ledningsförmåga är inte samma sak som ESD-säkerhet – för snabb avledning kan skada komponenten.", "Hur försiktigt man lägger ner komponenten påverkar inte vilken typ av urladdning som sker vid kontakt.", "Golvet under bordet ändrar inte bordsytans egna elektriska egenskaper."] },
          { text: "Vad är syftet med ESD-säker förpackning?", options: ["Att skydda komponenter mot repor, och endast det","Att avskärma, förhindra laddningsuppbyggnad och/eller säkert leda bort statisk laddning kring komponenten","Att göra förpackningen billigare att producera","Att förbättra produktens utseende för kunden"], correct: 1, explanation: "ESD-förpackning ska avskärma och/eller kontrollerat leda bort laddning.", notes: ["Det huvudsakliga syftet är skydd mot statisk laddning, inte repor.", "", "Kostnad är inte syftet med ESD-skyddet.", "Utseende är inte kopplat till ESD-funktionen."] },
          { text: "Vad krävs för att en avskärmande (shielding) förpackning faktiskt ska skydda mot ESD?", options: ["Artikeln måste vara helt innesluten och förpackningen försluten", "Det räcker att lägga artikeln löst på ett skärmande material, som en bricka", "Förpackningen måste vara genomskinlig för att fungera", "Skärmande material fungerar bara i kombination med ledande skum, aldrig ensamt"], correct: 0, explanation: "En avskärmande förpackning måste helt omsluta och förslutas kring artikeln – en öppen bricka eller löst material ger inget skydd, även om materialet i sig är rätt.", notes: ["", "En öppen eller löst täckt yta ger inget verkligt skydd, oavsett material.", "Genomskinlighet har inget med den elektriska skärmningen att göra.", "Avskärmande förpackning fungerar ensam, men kombineras ofta med dissipativt material som stötdämpning."] },
          { text: "Varför måste ESD-golv alltid kombineras med rätt ESD-skor eller skoöverdrag?", options: ["Golv och skor bildar tillsammans en fungerande jordningsväg – det ena utan det andra jordar inte operatören","Skorna gör golvet mjukare att gå på","Det är bara ett estetiskt krav","ESD-golv fungerar lika bra utan skor"], correct: 0, explanation: "Jordningsvägen kräver både rätt golv och rätt skor tillsammans.", notes: ["", "Komfort är inte anledningen, jordningsfunktionen är.", "Det handlar om en fungerande jordningsväg, inte estetik.", "Utan rätt skor bryts jordningsvägen."] },
          { text: "Hur leder ett ESD-golv i sig själv bort statisk laddning?", options: ["Golvmaterialet har inbyggda ledande fibrer eller ett ledande skikt som leder laddning till jordanslutningar utplacerade över golvytan", "Golvet är alltid täckt av metallplåt", "Golvet leder inte laddning alls, det är bara skorna som gör det", "Golvet fungerar genom att vara elektriskt isolerat"], correct: 0, explanation: "Golvmaterialet är uppbyggt av statisk-avledande eller ledande material med inbyggda ledande fibrer eller skikt, kopplade till jordanslutningar som t.ex. kopparband eller jordstuds.", notes: ["", "Metallplåt används inte som golvbeläggning i ett EPA.", "Golvets eget material bidrar också till jordningen, inte bara skorna.", "Ett isolerat golv skulle tvärtom förhindra jordning helt."] },
          { text: "En operatör vid en bänk med handledsrem behöver hämta ett kretskort från ett bord en bit bort. Operatören bär skoband och går på statiskt kontrollerat golv. Vad händer med jordningen när operatören kopplar ur handledsremmen för att gå dit?", options: ["Operatören förblir jordad, via skobanden och det statiskt kontrollerade golvet", "Operatören är inte längre jordad alls, eftersom handledsremmen är urkopplad", "Jordningen bryts helt tills handledsremmen ansluts igen vid en bänk", "Golvet fungerar bara som jordning om handledsremmen fortfarande är inkopplad"], correct: 0, explanation: "Skoband och statiskt kontrollerat golv utgör en egen, oberoende jordningsväg som fungerar oavsett om handledsremmen är inkopplad – det är precis därför den kombinationen används för personal som rör sig.", notes: ["", "Skoband och golv fortsätter jorda operatören oberoende av handledsremmen.", "Jordningen bryts inte förrän operatören lämnar det ledande golvet eller tar av skorna.", "Golvet och skorna fungerar som en egen jordningsväg, fristående från handledsremmen."] },
          { text: "Vad bör gälla för en besökare som tillfälligt går in i ett EPA?", options: ["Besökaren ska jordas, t.ex. med en tillfällig handledsrem eller skoöverdrag","Besökare behöver inga särskilda åtgärder","Besökare får bara gå in om de bär vita handskar","Besökare ska alltid ha med sig egna komponenter"], correct: 0, explanation: "Även tillfälliga besökare i ett EPA måste vara jordade för att inte äventyra skyddet.", notes: ["", "Även kortvariga besök kan äventyra skyddet utan jordning.", "Handskar hanterar inte den elektriska jordningen.", "Det har inget med jordningskravet att göra."] },
          { text: "En komponent ska packas för leverans till en kund. Den som packar lindar in komponenten i vanlig bubbelplast, med tanken att \"den ligger ändå i en kartong, så det borde räcka.\" Vad är problemet med det här tillvägagångssättet?", options: ["Bubbelplast är ett isolerande material som inte skyddar mot ESD och till och med kan bidra till uppladdning", "Kartong ger i sig fullgott ESD-skydd, så inget mer behövs", "Bubbelplast är ett fullgott skydd så länge kartongen är väl tejpad", "Det här är bara ett problem vid internationella leveranser"], correct: 0, explanation: "Vanlig bubbelplast är isolerande och skyddar inte mot ESD — rätt ESD-säker förpackning (t.ex. skärmande påsar eller ledande/dissipativa material) ska användas istället.", notes: ["", "Vanlig kartong ger inget elektriskt skydd i sig — det är förpackningsmaterialet närmast komponenten som avgör.", "Tejpning påverkar inte bubbelplastens isolerande egenskaper.", "Kravet på ESD-säker förpackning gäller alla leveranser, inte bara internationella."] }
        ]
      }
    ]
  },
  en: {
    modules: [
      {
        id: "m1",
        title: "Module 1: Introduction to ESD",
        icon: "spark",
        recap: [
          "ESD is a sudden equalization of charge between two objects at different electrical potential — the damage can be invisible and only show up much later.",
          "Charge builds up from friction between materials, or from a charged object nearby, e.g. floors, chairs, packaging, and ungrounded tools.",
          "Materials fall into three classes: conductive, static dissipative, and insulative — static dissipative is usually best for work surfaces and packaging.",
          "Latent failures are more dangerous than catastrophic ones — they often surface at the customer.",
          "The standardized warning symbol (triangle, hand, line) shows that an item is ESD-sensitive."
        ],
        sections: [
          { icon: "spark", diagram: "esdPhoto", heading: "What is Electrostatic Discharge (ESD)?", body: `<p>Electrostatic discharge (ESD) is when electric charge suddenly jumps between two objects — either when they touch, or when they get close enough for the charge to jump as a small spark. It can happen between a person and a component, between two components, or between a machine and a component.</p><p>We usually don't feel a discharge until it's around 3000 volts. But sensitive electronics can be damaged at just 100 volts — long before you'd notice anything at all.</p><p>The damage isn't always visible right away. A component can seem to work perfectly normally but be weakened, and only fail much later — often at the customer. That's why ESD is dangerous even when you don't feel or see anything happen.</p>` },
          { icon: "spark", diagram: "tribo", heading: "What Causes Static Charge?", body: `<p>Static charge builds up when two materials rub against each other and then separate — for example when you walk across a floor, stand up from a chair with synthetic upholstery, or handle a plastic bag. A charged object can also affect a component at a distance, without direct contact, if it gets close enough.</p><p>Common sources in the workplace are floors and shoes, chairs with synthetic fabric, packaging materials such as bubble wrap and plastic bags, and ungrounded tools and carts. Low humidity makes charge build up more easily and dissipate more slowly.</p>` },
          { icon: "materials", diagram: "condVsIns", heading: "Conductive, Static Dissipative, and Insulative Materials", body: `<p>Materials fall roughly into three groups based on how well they conduct away charge. <strong>Conductors</strong> (e.g. metal tools, tweezers, and the human body) let electrons move freely, so charge equalizes almost instantly. <strong>Insulators</strong> (e.g. plastic bottles, tape rolls, and foam cups) hold onto charge for a long time and can't be grounded away. <strong>Static dissipative materials</strong> sit between the two and are usually best for work surfaces, mats, and packaging — they conduct away charge in a calm, controlled way, instead of fast and uncontrolled like a pure conductor can.</p>` },
          { icon: "label", diagram: "esdSymbol", heading: "The Warning Symbol and Why Damage Can Be Invisible", body: `<p>An ESD failure can be <strong>catastrophic</strong> — the component stops working immediately and the failure is caught during test — or <strong>latent</strong>, which is more dangerous: the component is only partially damaged and keeps working at first, only to fail much later, often at the customer.</p><p>ESD-sensitive items (ESDS) are marked with a standardized warning symbol — a triangle containing a hand with a line through it. The symbol shows that the item must only be handled under ESD-protected conditions: grounded personnel, a grounded work surface, and ESD-safe packaging.</p>` }
        ],
        questions: [
          { text: "What is Electrostatic Discharge (ESD)?", options: ["A sudden transfer of static electricity between two objects at different electrical potential","A type of magnetic interference that affects circuit boards","A method for grounding electronic components","A chemical reaction that occurs during soldering"], correct: 0, explanation: "ESD is a sudden equalization of charge between two objects at different electrical potential.", notes: ["", "ESD is about electric charge, not magnetism.", "Grounding is a protective measure against ESD, not the definition of ESD.", "ESD has nothing to do with soldering or chemical reactions."] },
          { text: "What most commonly causes an electrostatic discharge in the workplace?", options: ["Friction between different materials (the triboelectric effect)","High temperatures in the room","Electromagnetic fields from tools","Moisture in the air"], correct: 0, explanation: "Triboelectric charging through friction/contact and separation is the most common cause.", notes: ["", "Temperature itself doesn't cause ESD, though dry air can make it worse.", "This is a different kind of interference, not the most common ESD cause.", "Moisture actually counteracts charge build-up — low humidity is the problem, not high."] },
          { text: "What is triboelectric charging?", options: ["Charge that occurs when two materials come into contact and then separate","Charge that only occurs during lightning strikes","Charge generated by batteries","Charge that is automatically neutralized by grounding"], correct: 0, explanation: "Triboelectric charging is formed precisely through contact and separation between materials.", notes: ["", "Lightning is a different, far more powerful phenomenon.", "Batteries generate current through chemical reactions, not friction.", "Grounding dissipates charge, but that's not what triboelectric charging describes."] },
          { text: "What is the difference between conductive and insulative materials?", options: ["Conductive materials allow charge to move freely, insulative materials hold the charge","Insulative materials always conduct electricity better than conductive materials","There is no practical difference for ESD control","Conductive materials can never become statically charged"], correct: 0, explanation: "Conductive materials can be grounded to dissipate charge, insulative materials retain it.", notes: ["", "It's the opposite — insulative materials hold charge instead of conducting it.", "The difference is the very foundation of how ESD control works.", "Even conductive materials can build up charge if they aren't grounded."] },
          { text: "Which of the following is an example of an everyday conductor?", options: ["A pair of metal tweezers", "A plastic bottle", "A roll of tape", "A foam cup"], correct: 0, explanation: "Metal tools like tweezers let electrons move freely, so they are conductors.", notes: ["", "A plastic bottle is an insulator that holds onto charge.", "A roll of tape is an insulator that holds onto charge.", "A foam cup is an insulator that holds onto charge."] },
          { text: "What characterizes a latent failure caused by ESD, as opposed to a catastrophic failure?", options: ["The component stops working immediately and the failure is caught during test","The component is partially damaged but keeps working at first, and may fail later in the field","The failure is always caught directly during production","Latent failures only affect the packaging, not the component"], correct: 1, explanation: "Latent failures are especially serious because they often surface only at the end customer.", notes: ["That describes a catastrophic failure, not a latent one.", "", "Latent failures are precisely the ones not caught right away.", "Latent failures involve damage to the component itself."] },
          { text: "What are materials with a resistance between conductive and insulative, which conduct away charge in a controlled, gradual manner, called?", options: ["Superconductors","Static dissipative materials","Semiconductors","Antimagnetic materials"], correct: 1, explanation: "Static dissipative materials sit between conductors and insulators and dissipate charge in a controlled way.", notes: ["Superconductors is a physics term for near-zero resistance, not this.", "", "Semiconductors are a material class in electronics, not an ESD resistance category.", "Magnetism has nothing to do with how charge is conducted away."] },
          { text: "How can you recognize that an item is ESD-sensitive (ESDS)?", options: ["Through a standardized warning symbol with a triangle, hand, and line on the item/packaging","The item is always yellow in color","It cannot be identified, you have to guess","Only because the item feels heavy"], correct: 0, explanation: "The standardized ESD warning symbol marks sensitive items and packaging.", notes: ["", "Color says nothing about ESD sensitivity.", "The standardized symbol makes it possible to see it directly.", "Weight has nothing to do with ESD sensitivity."] },
          { text: "A component passes all functional tests at the factory but stops working at the customer's site three months later. Afterwards it's discovered that an operator briefly touched the component without grounding shortly before it was packed. What is the most likely explanation?", options: ["A latent defect — the component was partially damaged by ESD but kept working at first", "A catastrophic failure — the component stopped working immediately", "EOS — incorrect voltage or current during test", "No connection to ESD, since the component passed all tests at the factory"], correct: 0, explanation: "This is a textbook latent defect: the component was partially damaged by an ESD event but worked at first, only to fail much later at the customer.", notes: ["", "A catastrophic failure would have been caught immediately at the factory, not three months later at the customer.", "Nothing indicates incorrect test voltage or current — the scenario describes an ungrounded touch, i.e. static discharge.", "Passing the factory tests is exactly what makes latent defects so dangerous — the damage isn't visible right away."] },
          { text: "Which of the following is NOT a typical source of static charge in a workplace?", options: ["A grounded ESD mat", "Walking on a floor in insulative shoes", "Bubble wrap and ordinary plastic bags", "Standing up from a chair with synthetic upholstery"], correct: 0, explanation: "A grounded ESD mat is, on the contrary, meant to dissipate charge — it's a protective measure, not a charge source.", notes: ["", "Insulative shoes on a floor are a common charge source.", "Bubble wrap and plastic bags are common insulative packaging materials that can charge up.", "Standing up from a chair with synthetic upholstery is a classic example of triboelectric charging."] }
        ]
      },
      {
        id: "m2",
        title: "Module 2: How Operators Prevent and Control ESD",
        icon: "wriststrap",
        recap: [
          "Grounding brings the operator and work surface to the same potential, so charge is safely conducted away.",
          "Wrist straps are used for seated work (against bare skin); ESD footwear/heel grounders are used when moving (require a conductive floor).",
          "All grounding equipment at a station must connect to the same common ground point — otherwise a small potential difference can cause a discharge.",
          "Grounding equipment is tested every shift with a tester — green means OK, red means the equipment must be checked or replaced.",
          "Hold circuit boards by the edge/corner and components by the body — never by the leads. An ungrounded metal object (isolated conductor) can be more dangerous than insulative material."
        ],
        sections: [
          { icon: "wriststrap", diagram: "groundWalk", heading: "Grounding — Wrist Straps and Footwear", body: `<p>Grounding connects the operator, the work surface, and equipment to a common ground potential, so static charge is conducted away safely instead of discharging uncontrolled through a component. Even sitting still and just moving your arms can charge the body to several hundred volts.</p><ul><li><strong>Wrist strap</strong> – connected around the wrist to a ground point, used for seated work at the bench. Should sit against bare skin, not over clothing.</li><li><strong>ESD footwear</strong> or <strong>heel/toe grounders</strong> – conduct charge through the sole to a conductive floor, and are used when moving around. Only work together with a conductive floor, and heel/toe grounders should ideally be worn on both feet.</li></ul><p>All grounding equipment at a station — wrist strap, bench mat, chair — must connect to <strong>the same common ground point</strong>. Otherwise a small potential difference between different ground points can be enough to cause a discharge, even though everything is technically grounded.</p>` },
          { icon: "monitor", diagram: "tester", heading: "Test the Equipment Every Day", body: `<p>Grounding equipment must be tested every shift, or every time you enter an ESD Protected Area. Use a tester: hold the wrist strap against the tester's plate, or stand on the footplates for a shoe test. A green light means OK, a red light means the equipment must be checked or replaced before work continues.</p><p>Also do a quick self-check every shift: that the wrist strap fits correctly and is intact, that your shoes make good contact with the floor, and that the work surface is free of insulative items like plastic cups and paper. Report any deviations directly to your shift leader.</p>` },
          { icon: "box", diagram: "handling", heading: "Handle Components Correctly", body: `<p>Hold circuit boards by the edge or corner, and components by the body — never by the leads. Handle items as little as possible, store and transport them in ESD-safe packaging, and never place them directly on an ordinary, non-ESD-safe surface.</p><p>Pay extra attention to <strong>ungrounded metal objects</strong> — such as a tool or a cart. These are called isolated conductors and can build up a high charge that then discharges all at once, often faster and more damaging than insulative material. Always check that metal objects on the work surface are grounded.</p>` },
          { icon: "smock", diagram: "smock", heading: "ESD Garments", body: `<p>An ESD smock made of static dissipative material keeps ordinary clothing from becoming an uncontrolled charge source. It only works if worn closed with snug cuffs against the wrists — an open smock breaks the conductive surface and the protection is lost.</p><p>Chairs in the ESD area should have static dissipative upholstery and connect to the same common ground point as the rest of the equipment. Avoid personal insulative items like jewelry and plastic cups near sensitive items.</p>` }
        ],
        questions: [
          { text: "What is the purpose of grounding at an ESD-safe workstation?", options: ["To bring the operator and the work surface to the same electrical potential as ground, so charge is safely conducted away","To increase the static charge on components in order to test them","To fully isolate the operator from the workbench","To prevent tools from conducting current"], correct: 0, explanation: "Grounding equalizes the potential between operator, bench, and component.", notes: ["", "The purpose is the opposite — to dissipate charge, not increase it.", "Grounding connects, rather than isolates, the operator and the bench.", "Grounding is about conducting away charge, not blocking conductivity."] },
          { text: "How often, and in what way, should an ESD wrist strap be tested to ensure it works correctly?", options: ["Never, putting it on is enough","Only when new equipment is purchased","Daily / at the start of every shift, using a dedicated tester that checks the resistance value","Once a year during an external audit"], correct: 2, explanation: "Daily testing with a dedicated tester ensures the equipment actually works.", notes: ["Equipment can stop working without it being visible — testing is required.", "Wear and tear can make the strap stop working later.", "", "That's far too infrequent — daily use requires daily checks."] },
          { text: "How should ESD-sensitive items (ESDS) be handled and transported correctly?", options: ["In ordinary unmarked plastic bags","In ESD-protective packaging, and only within an ESD protected area or using grounded transport equipment","Loose in a pocket while moving between stations","It does not matter as long as the component is not dropped"], correct: 1, explanation: "ESDS items require ESD-safe packaging and grounded handling/transport throughout.", notes: ["Ordinary plastic bags are insulative and don't protect against ESD.", "", "That provides neither shielding nor grounded handling.", "ESD damage isn't always visible right away, regardless of dropping."] },
          { text: "What is an ungrounded metal object, such as a tool, that can hold and suddenly discharge a high charge called?", options: ["A static dissipative device","An isolated conductor","A grounded component","An ESD-neutral item"], correct: 1, explanation: "An isolated conductor is a conductive object without grounding, making it a hidden hazard.", notes: ["Static dissipative material is a deliberate protective property, not this.", "", "Grounded means it IS grounded, which is the opposite.", "An ungrounded metal object is a risk, not neutral."] },
          { text: "Why can an isolated conductor be more damaging than many insulative materials during an ESD event?", options: ["The entire charge can discharge at once, quickly and forcefully","Isolated conductors never build up charge","They only affect the packaging","They are always automatically grounded"], correct: 0, explanation: "An ungrounded conductive object can produce a very fast and forceful discharge.", notes: ["", "It's the opposite — they can build up a high charge.", "The risk applies to direct contact with the component, not just packaging.", "It's precisely the lack of grounding that makes them dangerous."] },
          { text: "What is the purpose of an ESD smock made of static dissipative material?", options: ["To keep the operator warmer","To look professional","To prevent ordinary, insulative clothing from charging the operator","To completely replace the wrist strap"], correct: 2, explanation: "ESD garments prevent ordinary clothing from becoming an uncontrolled charge source.", notes: ["Comfort isn't the purpose, protection against charge is.", "The appearance is a side effect, not the purpose.", "", "The smock complements, but doesn't replace, the wrist strap."] },
          { text: "What should an operator do as part of their daily self-check?", options: ["Only check that the lighting works","Check the wrist strap, shoes/floor, and that the work surface is free of unauthorized insulative material","Wait for the next scheduled audit, no daily check is needed","Replace the entire workstation every day"], correct: 1, explanation: "A daily self-check of equipment and the work surface is the operator's own responsibility.", notes: ["Lighting isn't related to ESD self-checks.", "", "Daily checks are exactly what complements the scheduled audits.", "That's neither reasonable nor necessary — checking is enough."] },
          { text: "An operator puts on their wrist strap every morning but doesn't test it that day, since it \"worked fine yesterday.\" Later, a component at the operator's station is found to have ESD damage. What was the operator's key mistake?", options: ["Not testing the wrist strap daily/each shift before use", "Using a wrist strap instead of heel grounders", "Wearing the wrist strap over a sleeve", "Not wearing hearing protection at the station"], correct: 0, explanation: "Grounding equipment can stop working without it being visible or noticeable, which is why daily testing with a dedicated tester is required — it isn't enough that it worked the day before.", notes: ["", "Wrist straps and heel grounders serve different purposes, and neither replaces the requirement for daily testing.", "Wearing the strap over clothing would also be wrong, but that isn't described in the scenario — the issue here is the missing test.", "Hearing protection has nothing to do with ESD control."] },
          { text: "Why must all grounding equipment at a workstation — wrist strap, bench mat, chair — be connected to the same common ground point?", options: ["Otherwise a small potential difference between different ground points can cause an electrostatic discharge, even though everything is grounded", "It's purely a practical matter of cable length, not a safety issue", "Multiple ground points dissipate charge faster", "It's only required to meet fire-safety regulations"], correct: 0, explanation: "Two items can each individually be correctly grounded but still have a small potential difference if they connect to different ground points — that difference can be enough to cause a discharge when they touch the same component.", notes: ["", "This is a real ESD risk, not just a cabling detail.", "Multiple ground points actually risk creating potential differences, not faster dissipation.", "This is an ESD protection measure, not a fire-safety requirement."] },
          { text: "How should you hold a circuit board versus an individual component to reduce the risk of ESD damage?", options: ["Circuit boards by the edge/corner, components by the body — never by the leads", "It doesn't matter where you hold them as long as you're grounded", "Circuit boards in the middle where the components sit, for a better grip", "Components by the leads, to avoid touching the body"], correct: 0, explanation: "Holding circuit boards by the edge and components by the body reduces the risk of both ESD damage and physical damage to the sensitive leads.", notes: ["", "Correct handling technique reduces risk further, even for a grounded operator.", "This increases the risk of damaging or charging the components directly.", "The leads are the most sensitive and easiest to bend — they should be avoided, not used as a grip point."] }
        ]
      },
      {
        id: "m3",
        title: "Module 3: How Facilities Prevent and Control ESD",
        icon: "building",
        recap: [
          "An EPA requires controlled materials, grounding, and procedures throughout the area — even visitors must be grounded.",
          "The ESD mat connects to the common ground point; necessary insulative materials must be kept at least 30 cm (12 in) from ESD-sensitive items.",
          "Shielding packaging blocks external fields; dissipative packaging (\"pink poly\") conducts away charge but doesn't protect against sources outside the packaging.",
          "ESD flooring only works together with the correct ESD footwear — both are required together.",
          "Individuals without ESD training must be escorted by trained personnel inside an EPA."
        ],
        sections: [
          { icon: "building", diagram: "epa", heading: "ESD Protected Areas (EPA)", body: `<p>An EPA (ESD Protected Area) is a defined area where all surfaces, materials, equipment, and procedures are designed to control static electricity — grounded benches and flooring, controlled humidity, clear signage, and a requirement that all personnel entering are grounded.</p><p>Inside an EPA, every electronic item is treated as ESD sensitive, whether it's marked as such or not — a deliberate safety margin. Even temporary visitors must be grounded, for example with a temporary wrist strap, and anyone without ESD training must be escorted by trained personnel.</p>` },
          { icon: "fan", diagram: "workstationTools", heading: "The Workstation: Mat, Cord, and Packaging", body: `<p>The workstation should have an ESD mat on the bench and/or floor, connected to a common ground point, plus anti-static tools (e.g. screwdrivers with a ground cord). Nonessential insulative items like water bottles and styrofoam cups should be removed entirely. Insulative material actually needed for the job should be kept at least 30 cm from ESD-sensitive items.</p><p>For storage and transport, use ESD-safe packaging: <strong>shielding</strong> bags (metallized, fully sealed) block external electric fields, while <strong>dissipative</strong> packaging ("pink poly") conducts away charge in a controlled way but doesn't protect against charge outside the packaging. Ordinary bubble wrap and unmarked plastic bags must never be used for ESD-sensitive items.</p>` },
          { icon: "shoe", diagram: "floorShoes", heading: "Floor and Footwear Together", body: `<p>The floor is one of the most important grounding paths for personnel who move around, but it only works together with the correct ESD footwear or shoe covers — one without the other provides no grounding. The flooring material has embedded conductive fibers that carry charge onward to grounding connections in the floor, connected to the facility's common ground point.</p>` }
        ],
        questions: [
          { text: "What is an ESD Protected Area (EPA)?", options: ["An area with specially designed materials, grounding, and procedures for controlling static electricity","A warehouse for finished goods with no special requirements","An office without electronic equipment","An area where mobile phones are prohibited"], correct: 0, explanation: "An EPA is defined by controlled materials, grounding, and procedures.", notes: ["", "An EPA instead requires specially designed materials and procedures.", "It's about controlled static electricity, not the absence of equipment.", "A phone ban isn't what defines an EPA."] },
          { text: "What should be done with insulative items that aren't needed for the job, such as a water bottle or a styrofoam cup, at an ESD-safe workstation?", options: ["They should be removed from the workstation entirely", "They're harmless as long as they don't touch the component directly", "They just need to be moved to the other side of the room", "A static dissipative mat makes them harmless regardless of distance"], correct: 0, explanation: "Nonessential insulative items should be removed entirely, since they can build up charge and affect nearby components even without direct contact.", notes: ["", "A charged item can affect nearby components without direct contact, through induction.", "Just moving them isn't enough if they're still present at the workstation.", "Even with a dissipative mat, the risk remains if a charged item is too close."] },
          { text: "An insulative material is genuinely needed for the task and can't be removed from the workstation entirely. How far from ESD-sensitive items should it still be kept?", options: ["At least 30 cm (12 in)", "It doesn't matter as long as it doesn't touch the item", "At least 2 meters", "It's fine as long as it's sitting on a static dissipative mat"], correct: 0, explanation: "Insulative material that's actually needed for the job should be kept at least 30 cm (12 in) from ESD-sensitive items, since even a static dissipative mat can't guarantee protection if a charged item is too close.", notes: ["", "A nearby charged item can affect a component without direct contact, through induction.", "30 cm is the stated distance — 2 meters is not required.", "A dissipative mat doesn't reduce the risk if the charged item itself is too close to the item."] },
          { text: "An operator needs to put down a charged component while working on an assembly. One table is made of plain, untreated bare metal, another is a static dissipative ESD bench. Which table is the better choice?", options: ["The static dissipative ESD bench, since it conducts away charge slowly and safely", "The metal table, since metal always conducts best", "It doesn't matter as long as the component is set down carefully", "The metal table, as long as it's standing on ESD flooring"], correct: 0, explanation: "A static dissipative surface conducts away charge in a controlled, slow manner, while a fully conductive surface like untreated metal can make the charge jump over quickly and uncontrolled — which can itself cause an ESD event.", notes: ["", "Pure conductivity isn't the same as ESD safety — dissipating too fast can damage the component.", "How carefully the component is set down doesn't change the type of discharge that occurs on contact.", "The flooring beneath the table doesn't change the table surface's own electrical properties."] },
          { text: "What is the purpose of ESD-safe packaging?", options: ["To protect components from scratches, and nothing else","To shield, prevent charge build-up, and/or safely conduct away static charge around the component","To make the packaging cheaper to produce","To improve the product's appearance for the customer"], correct: 1, explanation: "ESD packaging should shield and/or controllably conduct away charge.", notes: ["The main purpose is protection against static charge, not scratches.", "", "Cost isn't the purpose of ESD protection.", "Appearance isn't related to the ESD function."] },

          { text: "How does ESD flooring itself conduct static charge away?", options: ["The flooring material has embedded conductive fibers or a conductive layer that carries charge to grounding connections spaced across the floor", "The floor is always covered in sheet metal", "The floor doesn't conduct charge at all, only the footwear does", "The floor works by being electrically insulated"], correct: 0, explanation: "The flooring material is built from static dissipative or conductive material with embedded conductive fibers or a layer, connected to grounding connections such as copper strips or grounding studs.", notes: ["", "Sheet metal isn't used as flooring in an EPA.", "The floor's own material also contributes to grounding, not just the footwear.", "An insulated floor would instead prevent grounding entirely."] },

function escapeRegExp(str){ return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

/* Wraps the first occurrence of each glossary term's alias (per module, across its sections)
   in a clickable span that jumps to that term in the glossary. Leaves headings/quiz text untouched. */
function linkifyGlossaryTerms(sections){
  const terms = GLOSSARY[state.lang];
  const usedIds = new Set();
  return sections.map(sec => {
    if(!sec.body) return sec;
    let body = sec.body;
    terms.forEach(entry => {
      if(usedIds.has(entry.id) || !entry.aliases || !entry.aliases.length) return;
      for(const alias of entry.aliases){
        const re = new RegExp("(?<!\\w)(" + escapeRegExp(alias) + ")(?!\\w)", "i");
        const parts = body.split(/(<[^>]+>)/g);
        let matched = false;
        for(let i = 0; i < parts.length; i++){
          if(i % 2 === 1) continue; // skip HTML tag segments, only linkify plain text
          if(re.test(parts[i])){
            parts[i] = parts[i].replace(re, `<span class="glossary-link" onclick="openGlossary('${entry.id}')">$1</span>`);
            matched = true;
            break;
          }
        }
        if(matched){
          body = parts.join("");
          usedIds.add(entry.id);
          break;
        }
      }
    });
    return Object.assign({}, sec, { body });
  });
}

function diagramTribo(L){
  const atom = (cx, cy, electronOffsets) => {
    const orbits = [0,60,120].map(rot => `<g transform="rotate(${rot} ${cx} ${cy})"><ellipse cx="${cx}" cy="${cy}" rx="70" ry="28" fill="none" stroke="#5b6b7a" stroke-width="1.4" opacity="0.5"/></g>`).join("");
    const nucleus = `
      <circle cx="${cx-7}" cy="${cy-5}" r="9" fill="url(#tribo-proton)"/>
      <circle cx="${cx+7}" cy="${cy-5}" r="9" fill="url(#tribo-proton)"/>
      <circle cx="${cx}" cy="${cy+7}" r="9" fill="url(#tribo-proton)"/>
      <text x="${cx-7}" y="${cy-2}" text-anchor="middle" style="fill:#0b2e4f" font-size="9" font-weight="700">+</text>
      <text x="${cx+7}" y="${cy-2}" text-anchor="middle" style="fill:#0b2e4f" font-size="9" font-weight="700">+</text>
      <text x="${cx}" y="${cy+10}" text-anchor="middle" style="fill:#0b2e4f" font-size="9" font-weight="700">+</text>
    `;
    const electrons = electronOffsets.map(([dx,dy]) => `
      <circle cx="${cx+dx}" cy="${cy+dy}" r="8" fill="url(#tribo-electron)" filter="url(#tribo-soft-shadow)"/>
      <text x="${cx+dx}" y="${cy+dy+3}" text-anchor="middle" style="fill:#fff" font-size="11" font-weight="700">−</text>
    `).join("");
    return orbits + nucleus + electrons;
  };

  const cx1 = 360, cx2 = 560, cy = 110;
  return `<svg class="diagram-svg" viewBox="0 0 660 270" role="img" aria-label="${escapeHtml(L.triboTitle)}">
    <defs>
      <radialGradient id="tribo-proton" cx="0.3" cy="0.3" r="0.8"><stop offset="0" stop-color="#5cbde8"/><stop offset="1" stop-color="#1f80b0"/></radialGradient>
      <radialGradient id="tribo-electron" cx="0.3" cy="0.3" r="0.8"><stop offset="0" stop-color="#e0685a"/><stop offset="1" stop-color="#a5301f"/></radialGradient>
      <linearGradient id="tribo-caption" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123a5e"/><stop offset="1" stop-color="#071c2f"/></linearGradient>
      <filter id="tribo-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b2e4f" flood-opacity="0.16"/></filter>
      <filter id="tribo-soft-shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0b2e4f" flood-opacity="0.25"/></filter>
    </defs>
    <rect x="10" y="65" width="180" height="100" rx="10" fill="url(#tribo-caption)" filter="url(#tribo-shadow)"/>
    <text x="100" y="102" text-anchor="middle" style="fill:#fff" font-size="13" font-weight="700">${escapeHtml(L.triboCaption1)}</text>
    <text x="100" y="122" text-anchor="middle" style="fill:#fff" font-size="13" font-weight="700">${escapeHtml(L.triboCaption2)}</text>
    <text x="100" y="142" text-anchor="middle" style="fill:#fff" font-size="13" font-weight="700">${escapeHtml(L.triboCaption3)}</text>

    <text x="${cx1}" y="20" text-anchor="middle" class="dg-label">${escapeHtml(L.triboObject1)}</text>
    ${atom(cx1, cy, [[0,-70],[0,70]])}
    <rect x="${cx1-75}" y="215" width="150" height="34" rx="17" fill="#fff" stroke="#3fa9dc" stroke-width="2" filter="url(#tribo-shadow)"/>
    <text x="${cx1}" y="237" text-anchor="middle" style="fill:#0b2e4f" font-size="13" font-weight="700">${escapeHtml(L.triboPositive)}</text>

    <text x="${cx2}" y="20" text-anchor="middle" class="dg-label">${escapeHtml(L.triboObject2)}</text>
    ${atom(cx2, cy, [[0,-70],[70,0],[0,70],[-70,0]])}
    <rect x="${cx2-75}" y="215" width="150" height="34" rx="17" fill="#fff" stroke="#c0392b" stroke-width="2" filter="url(#tribo-shadow)"/>
    <text x="${cx2}" y="237" text-anchor="middle" style="fill:#0b2e4f" font-size="13" font-weight="700">${escapeHtml(L.triboNegative)}</text>
  </svg>`;
}

function diagramSmock(L){
  const panel = (offsetX, closed) => {
    const color = closed ? "#2e8b57" : "#c0392b";
    const cuffGrad = closed ? "url(#smk-cuff-ok)" : "url(#smk-cuff-bad)";
    const seam = closed
      ? `<line x1="${offsetX+50}" y1="55" x2="${offsetX+50}" y2="155" stroke="${color}" stroke-width="4"/>`
      : `<line x1="${offsetX+42}" y1="55" x2="${offsetX+42}" y2="155" stroke="#0b2e4f" stroke-width="2.5"/><line x1="${offsetX+58}" y1="55" x2="${offsetX+58}" y2="155" stroke="#0b2e4f" stroke-width="2.5"/><line x1="${offsetX+50}" y1="55" x2="${offsetX+50}" y2="155" stroke="${color}" stroke-width="3" stroke-dasharray="4 4"/>`;
    const badgeMark = closed
      ? `<path d="M${offsetX+114} 45 L${offsetX+118} 49 L${offsetX+126} 39" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<line x1="${offsetX+114}" y1="40" x2="${offsetX+124}" y2="50" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="${offsetX+124}" y1="40" x2="${offsetX+114}" y2="50" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>`;
    return `<rect x="${offsetX}" y="50" width="100" height="110" rx="14" fill="url(#smk-body)" stroke="#0b2e4f" stroke-width="2" filter="url(#smk-shadow)"/>
    <rect x="${offsetX-35}" y="60" width="32" height="85" rx="12" fill="url(#smk-body)" stroke="#0b2e4f" stroke-width="2"/>
    <rect x="${offsetX+103}" y="60" width="32" height="85" rx="12" fill="url(#smk-body)" stroke="#0b2e4f" stroke-width="2"/>
    <circle cx="${offsetX+50}" cy="48" r="7" fill="#0b2e4f"/>
    ${seam}
    <rect x="${offsetX-35}" y="135" width="32" height="14" rx="4" fill="${cuffGrad}"/>
    <rect x="${offsetX+103}" y="135" width="32" height="14" rx="4" fill="${cuffGrad}"/>
    <circle cx="${offsetX+120}" cy="45" r="13" fill="${cuffGrad}" filter="url(#smk-shadow-sm)"/>
    ${badgeMark}`;
  };
  return `<svg class="diagram-svg" viewBox="0 0 640 200" role="img" aria-label="${escapeHtml(L.smockTitle)}">
    <defs>
      <linearGradient id="smk-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5f0"/><stop offset="1" stop-color="#b7cbdd"/></linearGradient>

function renderSteps(){
  const mods = modules();
  const finalQuizScreens = ["finalQuizIntro", "finalQuiz", "finalQuizResult"];
  const onFinalQuizScreen = finalQuizScreens.includes(state.screen);
  const finalQuizDone = !!(state.finalQuizResult && state.finalQuizResult.passed);
  let html = `<div class="stepper" role="list" aria-label="${escapeHtml(t("stepperLabel"))}">`;
  mods.forEach((m, i) => {
    const res = state.moduleResults[i];
    const isCurrent = i === state.currentModuleIndex && state.screen !== "final" && state.screen !== "certificate" && !onFinalQuizScreen;
    const isDone = !!(res && res.passed);
    let cls = "step-node";
    if(isCurrent) cls += " current";
    else if(isDone) cls += " done";
    const statusText = isCurrent ? t("stepCurrent") : (isDone ? t("stepDone") : "");
    html += `
      <div class="${cls}" role="listitem"${isCurrent ? ' aria-current="step"' : ""}>
        <div class="node-circle" aria-hidden="true">${isDone ? icon("check") : icon(m.icon)}</div>
        <div class="node-label">${escapeHtml(m.title)}${statusText ? `<span class="sr-only"> (${escapeHtml(statusText)})</span>` : ""}</div>
      </div>
    `;
    html += `<div class="step-connector${isDone ? " done" : ""}" aria-hidden="true"></div>`;
  });
  let fqCls = "step-node";
  if(onFinalQuizScreen) fqCls += " current";
  else if(finalQuizDone) fqCls += " done";
  const fqStatusText = onFinalQuizScreen ? t("stepCurrent") : (finalQuizDone ? t("stepDone") : "");
  html += `
    <div class="${fqCls}" role="listitem"${onFinalQuizScreen ? ' aria-current="step"' : ""}>
      <div class="node-circle" aria-hidden="true">${finalQuizDone ? icon("check") : icon("audit")}</div>
      <div class="node-label">${escapeHtml(t("finalQuizStepLabel"))}${fqStatusText ? `<span class="sr-only"> (${escapeHtml(fqStatusText)})</span>` : ""}</div>
    </div>
  `;
  html += "</div>";
  return html;
}

function makeQr(text, ecLevel){
  for(let type = 1; type <= 40; type++){
    try{
      const qr = qrcode(type, ecLevel);
      qr.addData(text);
      qr.make();
      return qr;
    }catch(e){
      if(String(e).indexOf("overflow") === -1) throw e;
    }
  }
  throw new Error("QR data too long");
}

    }catch(e){

  return startQrSvgCache;
}

function stripHtml(html){
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.textContent || "";
}
function getModulePlainText(mod){
  return mod.sections.map(s => s.heading + ". " + stripHtml(s.body)).join(" ");
}
function estimateReadingMinutes(mod){
  const words = getModulePlainText(mod).trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words / 180));
}
function estimateTotalMinutes(){
  const moduleMinutes = modules().reduce((sum, m) => sum + estimateReadingMinutes(m) + 2, 0);
  return moduleMinutes + 3; // ungefärlig tid för det avslutande blandade quizet
}
