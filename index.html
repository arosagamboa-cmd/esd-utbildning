<!doctype html>
<html lang="sv" id="html-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESD-utbildning / ESD Training – Vandewiele Sweden</title>
<style>
  :root{
    --navy:#0b2e4f;
    --navy-dark:#071c2f;
    --blue:#1a6fa8;
    --accent:#3fa9dc;
    --accent-dark:#1f80b0;
    --green:#2e8b57;
    --red:#c0392b;
    --bg:#eef2f6;
    --card:#ffffff;
    --text:#16222f;
    --muted:#5c6b7a;
    --border:#e1e7ed;
    --radius:20px;
    --radius-sm:14px;
    --shadow-sm:0 2px 6px rgba(15,35,60,0.06);
    --shadow-md:0 10px 28px rgba(15,35,60,0.10), 0 2px 6px rgba(15,35,60,0.05);
    --shadow-lg:0 24px 56px rgba(15,35,60,0.16), 0 4px 12px rgba(15,35,60,0.08);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family: var(--font-ui);
    background:var(--bg);
    color:var(--text);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-ui);text-wrap:balance;}
  header.topbar{
    background:rgba(7,28,47,0.94);
    backdrop-filter:blur(10px) saturate(140%);
    -webkit-backdrop-filter:blur(10px) saturate(140%);
    color:#fff;
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{
    height:42px;
    padding:6px 14px;
    background:#fff;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.18);
    flex:0 0 auto;
  }
  .brand-badge img{display:block;height:100%;width:auto;}
  .brand-text h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .brand-text p{margin:0;font-size:12px;color:#a9c5dc;}
  .lang-toggle{display:flex;gap:6px;}
  .lang-toggle button{
    background:rgba(255,255,255,0.1);
    color:#fff;
    border:1px solid rgba(255,255,255,0.28);
    padding:6px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    font-weight:600;
    transition:background-color 0.15s;
  }
  .lang-toggle button:hover{background:rgba(255,255,255,0.2);}
  .lang-toggle button.active{
    background:var(--accent);
    color:var(--navy-dark);
    border-color:var(--accent);
  }
  .header-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .glossary-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:var(--accent);
    color:var(--navy-dark);
    border:1px solid var(--accent);
    padding:7px 16px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    font-weight:700;
    font-family:var(--font-ui);
    box-shadow:0 2px 10px rgba(63,169,220,0.45);
    transition:background-color 0.15s, box-shadow 0.15s, transform 0.15s, color 0.15s;
  }
  .glossary-btn svg{width:15px;height:15px;flex:0 0 auto;}
  .glossary-btn:hover{background:var(--accent-dark);color:#fff;transform:translateY(-1px);}
  .glossary-btn.active{background:#fff;color:var(--blue);border-color:#fff;box-shadow:0 2px 10px rgba(255,255,255,0.3);}
  .glossary-btn.active:hover{background:#eaf6fd;transform:translateY(-1px);}
  .text-size-btn{
    background:rgba(255,255,255,0.1);
    color:#fff;
    border:1px solid rgba(255,255,255,0.28);
    padding:6px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    font-family:var(--font-ui);
    transition:background-color 0.15s;
  }
  .text-size-btn:hover{background:rgba(255,255,255,0.2);}
  .text-size-btn.active{background:var(--accent);color:var(--navy-dark);border-color:var(--accent);}
  body.text-large{zoom:1.2;}
  @media print{
    body.text-large{zoom:1;}
  }
  main{max-width:900px;margin:0 auto;padding:32px 16px 72px;}

  /* Hero (start screen) */
  .hero{
    background:linear-gradient(150deg,var(--navy) 0%,var(--blue) 115%);
    color:#fff;
    border-radius:var(--radius);
    padding:40px 36px;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
  }
  .hero:after{
    content:"";
    position:absolute;inset:0;
    z-index:-1;
    background-image:radial-gradient(rgba(255,255,255,0.09) 1px, transparent 1px);
    background-size:16px 16px;
    -webkit-mask-image:linear-gradient(120deg, rgba(0,0,0,0.9), transparent 70%);
    mask-image:linear-gradient(120deg, rgba(0,0,0,0.9), transparent 70%);
    pointer-events:none;
  }
  .hero-icon{position:absolute;right:-36px;bottom:-46px;opacity:0.14;width:230px;height:230px;transform:rotate(-8deg);}
  .hero-icon img{width:100%;height:100%;display:block;}
  .hero h2{position:relative;margin:0 0 10px;font-size:28px;letter-spacing:-0.01em;color:#fff;}
  .hero p{position:relative;margin:0;max-width:560px;color:#dcebf7;font-size:14.5px;}
  .hero-time{margin-top:10px !important;font-size:12.5px;color:#a9c5dc;font-weight:600;}
  .hero .company-tag{
    position:relative;
    display:inline-block;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.3);
    padding:4px 13px;
    border-radius:20px;
    font-size:11.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:16px;
  }

  .final-hero{
    background:linear-gradient(150deg,var(--navy) 0%,var(--blue) 115%);
    color:#fff;
    border-radius:var(--radius);
    padding:34px 30px;
    margin-bottom:22px;
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
  }
  .final-hero:after{
    content:"";
    position:absolute;inset:0;
    z-index:0;
    background-image:radial-gradient(rgba(255,255,255,0.1) 1.5px, transparent 1.5px);
    background-size:18px 18px;
    -webkit-mask-image:radial-gradient(circle at 50% 30%, rgba(0,0,0,0.9), transparent 72%);
    mask-image:radial-gradient(circle at 50% 30%, rgba(0,0,0,0.9), transparent 72%);
    pointer-events:none;
  }
  .final-hero-icon{position:relative;width:60px;height:60px;margin:0 auto 14px;color:#ffd166;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.25));}
  .final-hero-icon svg{width:100%;height:100%;}
  .final-hero h2{position:relative;color:#fff;margin:0 0 16px;font-size:23px;letter-spacing:-0.01em;}
  .final-hero .badge.pass{position:relative;background:#fff;color:var(--green);font-size:13px;padding:6px 18px;box-shadow:0 2px 8px rgba(0,0,0,0.15);}

  .start-row{display:flex;align-items:flex-start;gap:20px;}
  .start-name-card{flex:1 1 340px;min-width:0;margin-bottom:0;}
  .start-qr-card{
    flex:0 0 176px;
    margin-bottom:0;
    padding:20px 16px;
    text-align:center;
  }
  .start-qr-frame svg{width:100%;height:auto;display:block;}
  .start-qr-caption{margin:12px 0 2px;font-size:13px;font-weight:700;color:var(--navy);}
  .start-qr-hint{margin:0;font-size:11.5px;color:var(--muted);}
  @media (max-width:640px){
    .start-row{flex-direction:column;}
    .start-qr-card{display:none;}
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:32px;
    margin-bottom:24px;
    box-shadow:var(--shadow-md);
  }
  h2{margin-top:6px;color:var(--navy);display:flex;align-items:center;gap:10px;letter-spacing:-0.01em;}
  h2 .module-icon{width:34px;height:34px;color:var(--blue);flex:0 0 auto;}
  h3{color:var(--navy);margin:0 0 6px;font-size:16px;}
  .subtitle{color:var(--muted);margin-top:-4px;font-size:13px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--blue);
    color:#fff;
    border:none;
    padding:12px 22px;
    min-height:44px;
    border-radius:var(--radius-sm);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    box-shadow:var(--shadow-sm);
    transition:transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
  }
  .btn svg{width:16px;height:16px;flex:0 0 auto;}
  .btn:hover{background:#15618f;transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .btn:active{transform:translateY(0);box-shadow:var(--shadow-sm);}
  .btn.accent{background:var(--accent);color:var(--navy-dark);}
  .btn.accent:hover{background:var(--accent-dark);color:#fff;}
  .btn.outline{background:#fff;color:var(--blue);border:1px solid var(--border);}
  .btn.outline:hover{background:#f4f9fc;border-color:var(--blue);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center;}
  label.field-label{display:block;font-weight:600;margin-bottom:6px;margin-top:14px;font-size:14px;}
  label.field-label:first-of-type{margin-top:0;}
  input[type=text], input[type=email]{
    width:100%;max-width:360px;
    padding:13px 16px;
    min-height:44px;
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    font-size:14px;
    font-family:var(--font-ui);
    transition:border-color 0.15s;
  }
  input[type=text]:focus, input[type=email]:focus{outline:none;border-color:var(--blue);}
  .report-field{margin-top:14px;}
  .report-field label{display:block;font-weight:600;margin-bottom:6px;font-size:13.5px;}
  .report-field-row{display:flex;gap:8px;align-items:flex-start;}
  .report-field-row input, .report-field-row textarea{
    flex:1;
    min-width:0;
    max-width:none;
    padding:10px 12px;
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    font-size:13.5px;
    font-family:var(--font-ui);
    background:#fafcfe;
    color:var(--text);
    resize:vertical;
  }
  .report-field-row textarea{min-height:120px;line-height:1.5;}
  .copy-btn{flex-shrink:0;white-space:nowrap;}
  .copy-btn.copied{background:var(--green);color:#fff;border-color:var(--green);}
  .report-fallback-note{margin-top:16px;font-size:12.5px;color:var(--muted);}
  .report-fallback-note a{color:var(--blue);}
  .report-fallback-details{margin-top:16px;}
  .report-fallback-details summary{
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    color:var(--blue);
    padding:4px 0;
  }
  .report-fallback-details[open] summary{margin-bottom:4px;}
  .glossary-search{
    position:relative;
    max-width:420px;
    margin:16px 0 8px;
  }
  .glossary-search svg{
    position:absolute;
    left:13px;top:50%;
    transform:translateY(-50%);
    width:16px;height:16px;
    color:var(--muted);
    pointer-events:none;
  }
  .glossary-search input[type=text]{max-width:none;width:100%;padding-left:38px;padding-right:36px;}
  .glossary-clear-btn{
    position:absolute;
    right:8px;top:50%;
    transform:translateY(-50%);
    width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:none;cursor:pointer;
    color:var(--muted);
    border-radius:50%;
    padding:0;
  }
  .glossary-clear-btn svg{width:12px;height:12px;}
  .glossary-clear-btn:hover{background:var(--bg);color:var(--text);}
  .glossary-count{margin:0 0 16px;font-size:12.5px;color:var(--muted);font-weight:600;}
  .glossary-list{display:flex;flex-direction:column;gap:10px;}
  .glossary-letter{
    margin:14px 0 2px;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--accent-dark);
    text-transform:uppercase;
  }
  .glossary-letter:first-child{margin-top:0;}
  .glossary-entry{
    padding:14px 18px;
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:var(--radius-sm);
    background:#fafcfe;
    box-shadow:var(--shadow-sm);
    transition:box-shadow 0.15s ease, transform 0.15s ease;
  }
  .glossary-entry:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .glossary-entry h3{margin:0 0 5px;font-size:14.5px;color:var(--blue);}
  .glossary-entry p{margin:0;font-size:13.5px;color:var(--text);}
  .glossary-entry.highlight{border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,169,220,0.3);}
  .glossary-link{
    color:var(--blue);
    cursor:pointer;
    text-decoration:underline;
    text-decoration-style:dotted;
    text-underline-offset:2px;
  }
  .glossary-link:hover{color:var(--accent-dark);}
  @media (prefers-reduced-motion: reduce){
    .btn, .lang-toggle button, .glossary-btn, .text-size-btn, .glossary-entry, input[type=text], .option, .option-letter, .node-circle{transition:none;}
    html{scroll-behavior:auto;}
  }

  /* Stepper */
  .stepper{display:flex;align-items:flex-start;margin-bottom:24px;}
  .step-node{display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 auto;width:140px;text-align:center;}
  .node-circle{
    width:44px;height:44px;border-radius:50%;
    background:#fff;border:2px solid var(--border);color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-sm);
  }
  .node-circle svg{width:18px;height:18px;}
  .step-node.current .node-circle{border-color:var(--blue);color:var(--blue);background:#eaf3fa;box-shadow:0 0 0 4px rgba(26,111,168,0.14);}
  .step-node.done .node-circle{border-color:var(--green);color:#fff;background:var(--green);}
  .node-label{font-size:11.5px;color:var(--muted);line-height:1.3;}
  .step-node.current .node-label{color:var(--navy);font-weight:700;}
  .step-node.done .node-label{color:var(--green);font-weight:600;}
  .step-connector{flex:1 1 auto;height:2px;background:var(--border);margin-top:20px;min-width:16px;}
  .step-connector.done{background:var(--green);}
  @media (max-width:640px){
    .stepper{flex-wrap:wrap;row-gap:14px;}
    .step-connector{display:none;}
    .step-node{width:auto;flex:1 1 28%;}
  }

  .section-block{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);scroll-margin-top:96px;}
  .section-block:last-child{border-bottom:none;}
  .section-row{display:flex;gap:18px;align-items:flex-start;}
  .icon-badge{
    flex:0 0 auto;
    width:56px;height:56px;
    border-radius:16px;
    background:linear-gradient(160deg,#eaf3fa,#dcecf7);
    color:var(--blue);
    box-shadow:var(--shadow-sm);
    display:flex;align-items:center;justify-content:center;
  }
  .icon-badge svg{width:26px;height:26px;}
  .icon-badge-num{font-size:20px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;}
  .section-text{flex:1;min-width:0;}
  .section-text p, .section-text ul{margin:6px 0;max-width:68ch;}
  .section-text ul{padding-left:20px;}
  @media (max-width:560px){
    .section-row{flex-direction:column;}
  }
  .diagram-wrap{margin:16px 0 4px 0;padding:22px;background:#f6fafc;border:1px solid var(--border);border-radius:var(--radius-sm);}
  .diagram-svg{width:100%;height:auto;display:block;max-width:640px;margin:0 auto;}
  .diagram-svg text{font-family:var(--font-ui);fill:var(--text);}
  .diagram-svg .dg-label{font-size:14px;font-weight:700;fill:var(--navy);}
  .diagram-svg .dg-sub{font-size:11.5px;fill:var(--muted);}
  .tts-controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:14px 0 4px;padding:14px 18px;background:linear-gradient(135deg,#eaf6fd,#f6fafc);border-radius:var(--radius-sm);border:1px solid rgba(63,169,220,0.35);}
  .tts-play-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;border-radius:50%;flex:0 0 auto;
    background:var(--accent);color:#fff;border:none;cursor:pointer;
    box-shadow:0 3px 10px rgba(63,169,220,0.45);
    transition:transform 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  .tts-play-btn:hover{background:var(--accent-dark);transform:scale(1.06);}
  .tts-play-btn svg{width:20px;height:20px;}
  .tts-info{flex:1 1 auto;min-width:120px;}
  .tts-info-label{font-size:13.5px;font-weight:700;color:var(--navy);}
  .tts-info-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .section-toc{margin:14px 0 4px;padding:16px 20px;background:#f6fafc;border:1px solid var(--border);border-radius:var(--radius-sm);}
  .section-toc-title{font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;}
  .section-toc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:7px 18px;list-style:none;margin:0;padding:0;}
  .section-toc-list li{font-size:13.5px;line-height:1.4;}
  .section-toc-list a{color:var(--blue);text-decoration:none;display:flex;gap:9px;}
  .section-toc-list a:hover{color:var(--accent-dark);text-decoration:underline;}
  .section-toc-num{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums;}
  .recap-box{margin-top:6px;padding:18px 20px;background:linear-gradient(160deg,#eef8f1,#e7f5ec);border:1px solid #cde9d6;border-radius:var(--radius-sm);}
  .recap-title{display:flex;align-items:center;gap:8px;color:var(--green);margin:0 0 10px;font-size:15px;}
  .recap-title svg{width:18px;height:18px;flex:0 0 auto;}
  .recap-box ul{margin:0;padding-left:20px;}
  .recap-box li{margin-bottom:6px;color:var(--text);font-size:14px;}
  .recap-box li:last-child{margin-bottom:0;}
  .question{
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    padding:18px;
    margin-bottom:14px;
    background:#fff;
  }
  .question p.qtext{font-weight:600;margin-top:0;}
  .question p.qtag{
    display:inline-block;
    margin:0 0 8px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--accent-dark);
    background:#eaf6fd;
    padding:2px 9px;
    border-radius:10px;
  }
  .option{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px;
    min-height:48px;
    border-radius:var(--radius-sm);
    margin-bottom:10px;
    cursor:pointer;
    border:1.5px solid var(--border);
    background:#fff;
    transition:border-color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  .option:hover{border-color:var(--blue);background:#f7fafd;box-shadow:var(--shadow-sm);}
  .option-input{position:absolute;opacity:0;width:1px;height:1px;}
  .option-letter{
    flex:0 0 auto;
    width:28px;height:28px;
    border-radius:8px;
    background:var(--bg);
    color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
    font-size:13px;
    border:1.5px solid var(--border);
    transition:background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  .option-text{flex:1;}
  .option-input:focus-visible ~ .option-letter{outline:2px solid var(--blue);outline-offset:2px;}
  .option.selected{border-color:var(--blue);background:#eaf3fa;}
  .option.selected .option-letter{background:var(--blue);color:#fff;border-color:var(--blue);}
  .option.selected .option-text{font-weight:600;color:var(--navy);}
  .option.correct{background:#eaf7ef;border-color:var(--green);}
  .option.correct .option-letter{background:var(--green);color:#fff;border-color:var(--green);}
  .option.incorrect{background:#fbeceb;border-color:var(--red);}
  .option.incorrect .option-letter{background:var(--red);color:#fff;border-color:var(--red);}
  .badge{
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
  }
  .badge.pass{background:#eaf7ef;color:var(--green);}
  .badge.fail{background:#fbeceb;color:var(--red);}
  .msg{font-size:13px;color:var(--red);margin-top:8px;}
  .results-scroll{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;}
  table.results{width:100%;min-width:420px;border-collapse:collapse;}
  table.results th, table.results td{
    text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:14px;
  }
  table.results th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:0.4px;}
  .explanation{font-size:13px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);}
  .wrong-note{font-size:13px;color:#8a3a2c;background:#fdf3f1;border-left:3px solid var(--red);padding:8px 12px;margin:6px 0 0;border-radius:6px;}
  footer.appfoot{text-align:center;color:var(--muted);font-size:12px;padding:20px;}
  .admin-link{
    background:none;border:none;padding:0;
    color:var(--muted);
    font-size:12px;
    font-family:var(--font-ui);
    text-decoration:underline;
    text-decoration-style:dotted;
    text-underline-offset:2px;
    cursor:pointer;
  }
  .admin-link:hover{color:var(--blue);}
  .admin-backdrop{
    position:fixed;inset:0;
    background:rgba(7,28,47,0.55);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    z-index:200;
  }
  .admin-modal{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow-lg);
    padding:28px;
    max-width:380px;
    width:100%;
  }
  .admin-modal h2{margin:0 0 6px;font-size:18px;color:var(--navy);}
  .admin-modal .subtitle{margin:0 0 4px;}
  .admin-panel-modal{max-width:460px;max-height:85vh;overflow-y:auto;}
  .admin-pin-input{
    width:100%;
    margin-top:14px;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    font-size:22px;
    letter-spacing:6px;
    text-align:center;
    font-family:var(--font-ui);
  }
  .admin-pin-input:focus{outline:none;border-color:var(--blue);}
  .admin-error{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px;}
  .admin-section-label{
    margin:18px 0 8px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .admin-section-label:first-of-type{margin-top:6px;}
  .admin-nav-list{display:flex;flex-direction:column;gap:6px;}
  .admin-nav-item{
    display:block;
    width:100%;
    padding:10px 14px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    background:#fafcfe;
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
    text-align:left;
    font-family:var(--font-ui);
    transition:background-color 0.15s, border-color 0.15s;
  }
  .admin-nav-item:hover{background:#eef6fb;border-color:var(--accent);}
  .admin-modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    gap:10px;
  }
  @media (prefers-reduced-motion: reduce){
    .admin-nav-item{transition:none;}
  }
  .admin-form-field{margin-top:12px;text-align:left;}
  .admin-form-field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .admin-form-field input, .admin-form-field select{
    width:100%;
    padding:9px 12px;
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    font-size:14px;
    font-family:var(--font-ui);
    color:var(--text);
    background:#fff;
  }
  .admin-form-field input:focus, .admin-form-field select:focus{outline:none;border-color:var(--blue);}
  .admin-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}

  /* Diploma / certificate */
  #certificate-print{background:#f4f8fb;border-radius:var(--radius);}
  #certificate-print:before{display:none;}
  .diploma-frame{
    position:relative;
    overflow:hidden;
    border-radius:6px;
    padding:36px 46px 30px;
    font-family: Georgia, "Times New Roman", serif;
    color:#1c2733;
    background:#fdfdfe;
    min-height:460px;
    box-shadow:inset 0 0 0 1px var(--border);
  }
  .diploma-swoosh{position:absolute;inset:0;z-index:0;pointer-events:none;}
  .diploma-swoosh svg{width:100%;height:100%;display:block;}
  .diploma-content{position:relative;z-index:1;}
  .diploma-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
  .diploma-logo{flex:0 0 auto;background:#fff;padding:8px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
  .diploma-logo img{height:30px;width:auto;display:block;}
  .diploma-heading{text-align:right;}
  .diploma-headline{font-size:42px;letter-spacing:0.5px;color:var(--navy);margin:0;line-height:1;font-family:Georgia,"Times New Roman",serif;}
  .diploma-subheadline{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);margin:6px 0 0;font-family:"Segoe UI",Arial,sans-serif;font-weight:600;}
  .diploma-body{text-align:center;padding:0 6px 0 300px;}
  .diploma-pill{display:inline-block;background:var(--accent);color:#fff;padding:7px 22px;border-radius:20px;font-family:"Segoe UI",Arial,sans-serif;font-weight:700;font-size:12.5px;letter-spacing:0.8px;margin:38px 0 20px;}
  .diploma-line{color:#4a5a68;font-size:14px;margin:6px 0;font-family:"Segoe UI",Arial,sans-serif;}
  .diploma-name{font-size:34px;font-weight:700;font-style:italic;color:var(--blue);margin:6px 0 14px;}
  .diploma-course{font-size:16px;font-weight:700;color:var(--navy);margin:6px 0 16px;}
  .diploma-scores{font-size:12px;color:#5b6b7a;letter-spacing:0.3px;margin-bottom:14px;font-family:"Segoe UI",Arial,sans-serif;}
  .diploma-badge{display:inline-block;background:var(--green);color:#fff;padding:6px 22px;border-radius:20px;font-family:"Segoe UI",Arial,sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;margin-bottom:6px;}
  .diploma-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:30px;padding-left:130px;font-size:12px;color:#4a5a68;font-family:"Segoe UI",Arial,sans-serif;}
  .diploma-sign{width:200px;flex-shrink:0;}
  .diploma-date{width:150px;flex-shrink:0;}
  .diploma-sign-line{border-top:1px solid #4a5a68;margin-bottom:6px;}
  .diploma-seal{color:var(--blue);}
  .diploma-seal svg{width:52px;height:52px;}
  .diploma-date{text-align:right;}
  .diploma-date-row{margin-bottom:3px;}
  .diploma-date-label{color:var(--muted);}
  .diploma-validity-note{font-size:9.5px;color:var(--muted);margin-top:6px;line-height:1.4;max-width:200px;}
  .diploma-certno{position:relative;margin-top:20px;font-family:"Segoe UI",Arial,sans-serif;font-size:9.5px;letter-spacing:0.5px;color:var(--muted);text-align:right;}
  .diploma-watermark{display:none;}
  .diploma-sign-name{font-family:"Segoe Script","Brush Script MT",cursive;font-size:27px;color:var(--navy);line-height:1;margin:0 0 6px;}

  @media (max-width:640px){
    .diploma-frame{padding:26px 20px 22px;}
    .diploma-top{flex-direction:column;align-items:center;text-align:center;gap:10px;}
    .diploma-heading{text-align:center;}
    .diploma-headline{font-size:32px;}
    .diploma-pill{margin-top:22px;}
    .diploma-name{font-size:24px;}
    .diploma-course{font-size:14px;}
    .diploma-body{padding:0 6px;}
    .diploma-footer{flex-direction:column;justify-content:center;gap:18px;text-align:center;padding-left:0;}
    .diploma-sign, .diploma-date{width:100%;max-width:100%;text-align:center;}
    .diploma-sign-name{font-size:22px;}
    .diploma-validity-note{max-width:260px;margin-left:auto;margin-right:auto;}
  }

  @media print{
    @page{ size: A4 landscape; margin: 10mm; }
    body *{visibility:hidden;}
    #certificate-print, #certificate-print *{visibility:visible;}
    #certificate-print{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:none;}
    .no-print{display:none !important;}
  }
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],
