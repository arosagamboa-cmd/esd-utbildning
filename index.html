function ttsToggle(){
  if(!("speechSynthesis" in window)) return;
  if(ttsStatus === "idle"){
    const mod = modules()[state.currentModuleIndex];
    const text = getModulePlainText(mod);
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = state.lang === "sv" ? "sv-SE" : "en-US";
    utter.rate = 0.95;
    utter.onend = () => { ttsStatus = "idle"; if(state.screen === "module") render(); };
    utter.onerror = () => { ttsStatus = "idle"; if(state.screen === "module") render(); };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
    ttsStatus = "playing";
  } else if(ttsStatus === "playing"){
    window.speechSynthesis.pause();
    ttsStatus = "paused";
  } else if(ttsStatus === "paused"){
    window.speechSynthesis.resume();
    ttsStatus = "playing";
  }
  render();
}
function ttsStop(){
  stopSpeech();
  render();
}

function buildQuizOrder(moduleIndex){
  const qs = modules()[moduleIndex].questions;
  const count = Math.min(CONFIG.questionsPerQuiz, qs.length);
  const questionOrder = shuffleArray(qs.map((_, i) => i)).slice(0, count);
  const optionOrders = questionOrder.map(qi => shuffleArray(qs[qi].options.map((_, i) => i)));
  return { moduleIndex, questionOrder, optionOrders };
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function goToQuiz(){
  stopSpeech();
  state.currentQuiz = buildQuizOrder(state.currentModuleIndex);
  state.currentQuizAnswers = {};
  state.currentMsg = "";
  state.screen = "quiz";
  save();
  render();
  scrollTop();
}

const OPTION_LETTERS = ["A", "B", "C", "D", "E", "F"];

function renderQuiz(){
  const mod = modules()[state.currentModuleIndex];
  const quiz = state.currentQuiz;
  let qHtml = quiz.questionOrder.map((qi, pos) => {
    const q = mod.questions[qi];
    const optOrder = quiz.optionOrders[pos];
    const selected = state.currentQuizAnswers[pos];
    let optsHtml = optOrder.map((oi, optPos) => `
      <label class="option${selected === optPos ? " selected" : ""}">
        <input class="option-input" type="radio" name="q${pos}" value="${optPos}" ${selected === optPos ? "checked" : ""} onchange="selectAnswer(${pos}, ${optPos}, this)">
        <span class="option-letter">${OPTION_LETTERS[optPos] || (optPos+1)}</span>
        <span class="option-text">${escapeHtml(q.options[oi])}</span>
      </label>
    `).join("");
    return `
      <div class="question">
        <p class="qtext">${t("questionOf", {n: pos+1, total: quiz.questionOrder.length})}: ${escapeHtml(q.text)}</p>
        ${optsHtml}
      </div>
    `;
  }).join("");

  app.innerHTML = `
    ${renderSteps()}
    <div class="card">
      <h2><span class="module-icon">${icon(mod.icon)}</span>${escapeHtml(mod.title)}</h2>
      ${qHtml}
      <div id="quiz-msg" class="msg">${escapeHtml(state.currentMsg)}</div>
      <div class="btn-row">
        <button class="btn outline" onclick="backToContent()">${t("backToContent")}</button>
        <button class="btn accent" onclick="submitQuiz()">${t("submitQuiz")}</button>
      </div>
    </div>
  `;
}

function selectAnswer(pos, optPos, inputEl){
  state.currentQuizAnswers[pos] = optPos;
  if(inputEl){
    const question = inputEl.closest(".question");
    if(question){
      question.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
    }
    const label = inputEl.closest(".option");
    if(label) label.classList.add("selected");
  }
}

function backToContent(){
  stopSpeech();
  state.screen = "module";
  save();
  render();
  scrollTop();
}

function submitQuiz(){
  const quiz = state.currentQuiz;
  const total = quiz.questionOrder.length;
  for(let pos = 0; pos < total; pos++){
    if(state.currentQuizAnswers[pos] === undefined){
      state.currentMsg = t("pleaseAnswerAll");
      render();
      return;
    }
  }
  const mod = modules()[state.currentModuleIndex];
  let score = 0;
  const detail = [];
  quiz.questionOrder.forEach((qi, pos) => {
    const q = mod.questions[qi];
    const optOrder = quiz.optionOrders[pos];
    const selectedPos = state.currentQuizAnswers[pos];
    const selectedOrigIndex = optOrder[selectedPos];
    const isCorrect = selectedOrigIndex === q.correct;
    if(isCorrect) score++;
    detail.push({
      text: q.text,
      yourAnswer: q.options[selectedOrigIndex],
      correctAnswer: q.options[q.correct],
      isCorrect,
      explanation: q.explanation,
      wrongNote: (!isCorrect && q.notes) ? q.notes[selectedOrigIndex] : ""
    });
  });
  const passed = (score / total) >= CONFIG.passThreshold;
  const prev = state.moduleResults[state.currentModuleIndex];
  const attempts = (prev ? prev.attempts : 0) + 1;
  state.moduleResults[state.currentModuleIndex] = { score, total, passed, attempts };
  state.lastAttemptDetail = detail;
  state.currentMsg = "";
  state.screen = "moduleResult";
  save();
  render();
  scrollTop();
}

function renderModuleResult(){
  const mod = modules()[state.currentModuleIndex];
  const res = state.moduleResults[state.currentModuleIndex];
  const detail = state.lastAttemptDetail || [];

  let detailHtml = detail.map((d, i) => `
    <div class="question">
      <p class="qtext">${i+1}. ${escapeHtml(d.text)}</p>
      <div class="option ${d.isCorrect ? "correct" : "incorrect"}">
        <span>${t("yourAnswer")}: ${escapeHtml(d.yourAnswer)}</span>
      </div>
      ${!d.isCorrect && d.wrongNote ? `<p class="wrong-note">${escapeHtml(d.wrongNote)}</p>` : ""}
      ${!d.isCorrect ? `<div class="option correct"><span>${t("correctAnswer")}: ${escapeHtml(d.correctAnswer)}</span></div>` : ""}
      <div class="explanation">${escapeHtml(d.explanation)}</div>
    </div>
  `).join("");

  const isLastModule = state.currentModuleIndex === modules().length - 1;

  app.innerHTML = `
    ${renderSteps()}
    <div class="card">
      <h2><span class="module-icon">${icon(mod.icon)}</span>${escapeHtml(mod.title)}</h2>
      <p>
        <span class="badge ${res.passed ? "pass" : "fail"}">${res.passed ? t("passed") : t("failed")}</span>
        &nbsp; ${t("yourScore")}: <strong>${res.score} / ${res.total}</strong>
        &nbsp;&middot;&nbsp; ${t("attemptsLabel")}: ${res.attempts}
      </p>
      <p class="subtitle">${t("passNote", {pct: Math.round(CONFIG.passThreshold*100), need: Math.ceil(CONFIG.passThreshold*res.total), total: res.total})}</p>
      ${detailHtml}
      <div class="btn-row">
        ${res.passed
          ? `<button class="btn accent" onclick="nextModule()">${isLastModule ? t("toFinalQuiz") : t("nextModule")}</button>`
          : `<button class="btn accent" onclick="retryQuiz()">${t("retryQuiz")}</button>
             <button class="btn outline" onclick="backToContent()">${t("backToContent")}</button>`
        }
      </div>
    </div>
  `;
}

function retryQuiz(){
  goToQuiz();
}

function nextModule(){
  stopSpeech();
  if(state.currentModuleIndex < modules().length - 1){
    state.currentModuleIndex++;
    state.screen = "module";
  } else {
    state.screen = "finalQuizIntro";
  }
  save();
  render();
  scrollTop();
}

/* =========================================================
   AVSLUTANDE BLANDAT QUIZ - obligatoriskt steg efter alla tre
   moduler, blandar frågor från hela kursen. Krävs för certifikatet.
   ========================================================= */
function buildFinalQuizOrder(){
  const pool = [];
  modules().forEach((m, mi) => {
    m.questions.forEach((_, qi) => pool.push({ mi, qi }));
  });
  const count = Math.min(CONFIG.finalQuizQuestionCount, pool.length);
  const questionOrder = shuffleArray(pool.map((_, i) => i)).slice(0, count).map(i => pool[i]);
  const optionOrders = questionOrder.map(({ mi, qi }) => shuffleArray(modules()[mi].questions[qi].options.map((_, i) => i)));
  return { questionOrder, optionOrders };
}

function renderFinalQuizIntro(){
  const hasPrevAttempt = !!state.finalQuizResult;
  app.innerHTML = `
    ${renderSteps()}
    <div class="card">
      <h2><span class="module-icon">${icon("audit")}</span>${t("finalQuizIntroTitle")}</h2>
      <p>${t("finalQuizIntroText", {count: CONFIG.finalQuizQuestionCount, pct: Math.round(CONFIG.passThreshold*100)})}</p>
      ${hasPrevAttempt && !state.finalQuizResult.passed ? `
        <p class="subtitle">${t("finalQuizRetryIntro")}</p>
        <p><span class="badge fail">${t("failed")}</span> &nbsp; ${t("yourScore")}: <strong>${state.finalQuizResult.score} / ${state.finalQuizResult.total}</strong></p>
      ` : ""}
      <div class="btn-row">
        <button class="btn accent" onclick="goToFinalQuiz()">${t("finalQuizStartBtn")}</button>
      </div>
    </div>
  `;
}

function goToFinalQuiz(){
  stopSpeech();
  state.finalQuiz = buildFinalQuizOrder();
  state.finalQuizAnswers = {};
  state.currentMsg = "";
  state.screen = "finalQuiz";
  save();
  render();
  scrollTop();
}

function renderFinalQuiz(){
  const quiz = state.finalQuiz;
  let qHtml = quiz.questionOrder.map((ref, pos) => {
    const q = modules()[ref.mi].questions[ref.qi];
    const optOrder = quiz.optionOrders[pos];
    const selected = state.finalQuizAnswers[pos];
    let optsHtml = optOrder.map((oi, optPos) => `
      <label class="option${selected === optPos ? " selected" : ""}">
        <input class="option-input" type="radio" name="fq${pos}" value="${optPos}" ${selected === optPos ? "checked" : ""} onchange="selectFinalAnswer(${pos}, ${optPos}, this)">
        <span class="option-letter">${OPTION_LETTERS[optPos] || (optPos+1)}</span>
        <span class="option-text">${escapeHtml(q.options[oi])}</span>
      </label>
    `).join("");
    return `
      <div class="question">
        <p class="qtag">${escapeHtml(t("module"))} ${ref.mi+1}</p>
        <p class="qtext">${t("questionOf", {n: pos+1, total: quiz.questionOrder.length})}: ${escapeHtml(q.text)}</p>
        ${optsHtml}
      </div>
    `;
  }).join("");

  app.innerHTML = `
    ${renderSteps()}
    <div class="card">
      <h2><span class="module-icon">${icon("audit")}</span>${t("finalQuizIntroTitle")}</h2>
      ${qHtml}
      <div id="quiz-msg" class="msg">${escapeHtml(state.currentMsg)}</div>
      <div class="btn-row">
        <button class="btn accent" onclick="submitFinalQuiz()">${t("submitQuiz")}</button>
      </div>
    </div>
  `;
}

function selectFinalAnswer(pos, optPos, inputEl){
  state.finalQuizAnswers[pos] = optPos;
  if(inputEl){
    const question = inputEl.closest(".question");
    if(question){
      question.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
    }
    const label = inputEl.closest(".option");
    if(label) label.classList.add("selected");
  }
}

function submitFinalQuiz(){
  const quiz = state.finalQuiz;
  const total = quiz.questionOrder.length;
  for(let pos = 0; pos < total; pos++){
    if(state.finalQuizAnswers[pos] === undefined){
      state.currentMsg = t("pleaseAnswerAll");
      render();
      return;
    }
  }
  let score = 0;
  const detail = [];
  quiz.questionOrder.forEach((ref, pos) => {
    const q = modules()[ref.mi].questions[ref.qi];
    const optOrder = quiz.optionOrders[pos];
    const selectedPos = state.finalQuizAnswers[pos];
    const selectedOrigIndex = optOrder[selectedPos];
    const isCorrect = selectedOrigIndex === q.correct;
    if(isCorrect) score++;
    detail.push({
      text: q.text,
      moduleIndex: ref.mi,
      yourAnswer: q.options[selectedOrigIndex],
      correctAnswer: q.options[q.correct],
      isCorrect,
      explanation: q.explanation,
      wrongNote: (!isCorrect && q.notes) ? q.notes[selectedOrigIndex] : ""
    });
  });
  const passed = (score / total) >= CONFIG.passThreshold;
  const attempts = (state.finalQuizResult ? state.finalQuizResult.attempts : 0) + 1;
  state.finalQuizResult = { score, total, passed, attempts };
  state.finalQuizDetail = detail;
  state.currentMsg = "";
  if(passed){
    state.completedAt = new Date().toISOString();
  }
  state.screen = "finalQuizResult";
  save();
  render();
  scrollTop();
}

function retryFinalQuiz(){
  goToFinalQuiz();
}

function renderFinalQuizResult(){
  const res = state.finalQuizResult;
  const detail = state.finalQuizDetail || [];

  let detailHtml = detail.map((d, i) => `
    <div class="question">
      <p class="qtag">${escapeHtml(t("module"))} ${d.moduleIndex+1}</p>
      <p class="qtext">${i+1}. ${escapeHtml(d.text)}</p>
      <div class="option ${d.isCorrect ? "correct" : "incorrect"}">
        <span>${t("yourAnswer")}: ${escapeHtml(d.yourAnswer)}</span>
      </div>
      ${!d.isCorrect && d.wrongNote ? `<p class="wrong-note">${escapeHtml(d.wrongNote)}</p>` : ""}
      ${!d.isCorrect ? `<div class="option correct"><span>${t("correctAnswer")}: ${escapeHtml(d.correctAnswer)}</span></div>` : ""}
      <div class="explanation">${escapeHtml(d.explanation)}</div>
    </div>
  `).join("");

  app.innerHTML = `
    ${renderSteps()}
    <div class="card">
      <h2><span class="module-icon">${icon("audit")}</span>${t("finalQuizIntroTitle")}</h2>
      <p>
        <span class="badge ${res.passed ? "pass" : "fail"}">${res.passed ? t("passed") : t("failed")}</span>
        &nbsp; ${t("yourScore")}: <strong>${res.score} / ${res.total}</strong>
        &nbsp;&middot;&nbsp; ${t("attemptsLabel")}: ${res.attempts}
      </p>
      <p class="subtitle">${t("passNote", {pct: Math.round(CONFIG.passThreshold*100), need: Math.ceil(CONFIG.passThreshold*res.total), total: res.total})}</p>
      ${detailHtml}
      <div class="btn-row">
        ${res.passed
          ? `<button class="btn accent" onclick="goToSummary()">${t("toFinal")}</button>`
          : `<button class="btn accent" onclick="retryFinalQuiz()">${t("retryQuiz")}</button>`
        }
      </div>
    </div>
  `;
}

function goToSummary(){
  stopSpeech();
  state.screen = "final";
  const shouldAutoEmail = !state.resultsEmailAutoSent;
  if(shouldAutoEmail) state.resultsEmailAutoSent = true;
  save();
  render();
  scrollTop();
  if(shouldAutoEmail){
    // mailto: navigation is blocked outright by the published-Artifact viewer
    // sandbox (confirmed via real-device testing — see esd-power-automate-reference
    // memory). Try the native share sheet first (not a navigation, so not subject to
    // that block); either way, also silently copy the subject to the clipboard as a
    // free backup — the report card below (already in the DOM after render()) lets
    // the learner finish sending manually regardless of which path worked.
    shareReport();
    copyReportField("subject");
  }
}

function addYears(date, years){
  const d = new Date(date);
  d.setFullYear(d.getFullYear() + years);
  return d;
}
function certNumber(name, dateIso){
  const s = (name || "") + "|" + (dateIso || "");
  let hash = 0;
  for(let i = 0; i < s.length; i++){
    hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  }
  const datePart = (dateIso || "").replace(/[^0-9]/g, "").slice(0, 8);
  return "ESD-" + datePart + "-" + String(hash % 9000 + 1000);
}

function esdDataField(v){
  return String(v == null ? "" : v).replace(/[|\r\n]+/g, " ").trim();
}

// Builds the single-line, pipe-delimited "ESDDATA|..." record appended to the
// results email body. A Power Automate flow (see POWER-AUTOMATE-SETUP.md)
// parses this line to log completions to SharePoint automatically — field
// order/count here must stay in sync with that flow's split-by-"|" indexes:
// 0 marker, 1 name, 2 email, 3 certNumber, 4 completedAt, 5 validUntil,
// 6 language, 7 overallPassed, 8/9 module1 score+attempts, 10/11 module2,
// 12/13 module3, 14/15 finalQuiz.
function buildEsdDataLine(){
  const mods = modules();
  const completedAt = state.completedAt || new Date().toISOString();
  const validUntil = addYears(completedAt, 2).toISOString();
  const certNo = certNumber(state.name, completedAt);
  const modFields = mods.map((m, i) => {
    const res = state.moduleResults[i] || { score: 0, total: m.questions.length, attempts: 0 };
    return [`${res.score}/${res.total}`, res.attempts];
  }).flat();
  const fq = state.finalQuizResult;
  const fqFields = fq ? [`${fq.score}/${fq.total}`, fq.attempts] : ["-", 0];
  return ["ESDDATA", state.name, state.email, certNo, completedAt, validUntil, state.lang, "true", ...modFields, ...fqFields]
    .map(esdDataField).join("|");
}

function buildReportParts(){
  const mods = modules();
  const completedAt = state.completedAt || new Date().toISOString();
  const dateStr = new Date(completedAt).toLocaleDateString(state.lang === "sv" ? "sv-SE" : "en-GB");
  const validUntilStr = addYears(completedAt, 2).toLocaleDateString(state.lang === "sv" ? "sv-SE" : "en-GB");
  const certNo = certNumber(state.name, completedAt);
  const lines = mods.map((m, i) => {
    const res = state.moduleResults[i];
    return "- " + m.title + ": " + res.score + "/" + res.total + " (" + (res.passed ? t("passed") : t("failed")) + ")";
  });
  if(state.finalQuizResult){
    const fq = state.finalQuizResult;
    lines.push("- " + t("finalQuizStepLabel") + ": " + fq.score + "/" + fq.total + " (" + (fq.passed ? t("passed") : t("failed")) + ")");
  }
  const body = [
    CONFIG.companyName,
    t("certTitle"),
    "",
    t("certLeadIn") + " " + state.name,
    t("certAfterName"),
    t("certCourse"),
    t("emailLabel") + ": " + (state.email || "-"),
    "",
    ...lines,
    "",
    t("overallPassed"),
    t("certDate") + ": " + dateStr,
    t("validUntilLabel") + ": " + validUntilStr,
    t("certNumberLabel") + ": " + certNo,
    "",
    t("validityNote")
  ].join("\n");
  // The machine-readable record travels in the SUBJECT, not the body: email
  // clients (Outlook in particular) often re-render a mailto: body as HTML,
  // which can mangle line breaks inside a body-embedded data line. Subject
  // lines are always plain text, so this is the reliable place for it.
  const subject = "[ESD] " + t("certTitle") + " - " + state.name + " :: " + buildEsdDataLine();
  return { to: CONFIG.resultsEmail, subject, body };
}

function buildMailtoUrl(){
  const parts = buildReportParts();
  const cc = state.email ? `&cc=${encodeURIComponent(state.email)}` : "";
  return `mailto:${parts.to}?subject=${encodeURIComponent(parts.subject)}&body=${encodeURIComponent(parts.body)}${cc}`;
}

// Clipboard fallback for the mailto: block confirmed on published Artifacts (the
// viewer sandbox blocks mailto: navigation entirely — see esd-power-automate-reference
// memory). Copies one field at a time rather than one combined blob so the subject
// line reliably lands in the recipient's actual Subject field, since that's what the
// Power Automate flow parses — pasting everything into the body would silently break
// SharePoint logging even though the email itself would look fine to a human reader.
async function copyReportField(which){
  const parts = buildReportParts();
  const text = parts[which];
  const btn = document.getElementById("copy-btn-" + which);
  let ok = false;
  try{
    await navigator.clipboard.writeText(text);
    ok = true;
  }catch(e){
    const ta = document.getElementById("copy-field-" + which);
    if(ta){
      ta.removeAttribute("readonly");
      ta.focus();
      ta.select();
      try{ ok = document.execCommand("copy"); }catch(e2){ ok = false; }
      ta.setAttribute("readonly", "readonly");
    }
  }
  if(btn && ok){
    const original = btn.textContent;
    btn.textContent = t("copiedBtn");
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 2000);
  }
  return ok;
}

// Web Share API instead of mailto: — a native OS share-sheet invocation, not a page
// navigation, so it is not subject to the Artifact viewer's mailto: navigation block
// (see esd-power-automate-reference memory). Chrome/Android's implementation maps
// {title,text} to the same Intent.EXTRA_SUBJECT/EXTRA_TEXT that ordinary "Share to
// email" uses elsewhere in Android, so most mail apps correctly place `title` in the
// Subject field — but this is app-dependent and unverified for every mail client, so
// the copy-fields card stays as a fallback underneath rather than being replaced.
async function shareReport(){
  if(!(navigator.share)) return false;
  const parts = buildReportParts();
  try{
    await navigator.share({ title: parts.subject, text: parts.body });
    return true;
  }catch(e){
    return false; // AbortError (user cancelled) or unsupported — no error UI needed
  }
}

function startCourse(){
  const input = document.getElementById("name-input");
  const emailInput = document.getElementById("email-input");
  const name = input ? input.value.trim() : "";
  const email = emailInput ? emailInput.value.trim() : "";
  if(!name){
    document.getElementById("start-msg").textContent = t("nameRequired");
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    document.getElementById("start-msg").textContent = t("emailRequired");
    return;
  }
  const saved = loadSaved();
  const hasUnfinishedProgress = saved && saved.screen && saved.screen !== "start" && saved.screen !== "final" && saved.screen !== "certificate";
  if(hasUnfinishedProgress && !confirm(t("restartConfirm"))){
    return;
  }
  stopSpeech();
  clearSaved();
  state = freshProgress();
  state.name = name;
  state.email = email;
  save();
  render();
  scrollTop();
}

function resumeCourse(){
  const saved = loadSaved();
  if(saved){
    stopSpeech();
    state = saved;
    render();
    scrollTop();
  }
}

function switchLang(lang){
  stopSpeech();
  state.lang = lang;
  save();
  render();
}

function applyLargeText(){
  document.body.classList.toggle("text-large", largeTextEnabled);
  const btn = document.getElementById("text-size-btn");
  btn.classList.toggle("active", largeTextEnabled);
  btn.setAttribute("aria-pressed", largeTextEnabled ? "true" : "false");
  btn.title = t("textSizeBtn");
  document.getElementById("text-size-btn-label").textContent = t("textSizeBtnLabel");
}

function toggleLargeText(){
  largeTextEnabled = !largeTextEnabled;
  try{ localStorage.setItem(LARGE_TEXT_STORAGE_KEY, largeTextEnabled ? "1" : "0"); }catch(e){}
  applyLargeText();
}

function openGlossary(highlightId){
  const alreadyOpen = state.screen === "glossary";
  if(alreadyOpen && !highlightId) return;
  stopSpeech();
  if(!alreadyOpen){
    glossaryReturnScreen = state.screen;
    scrollTop();
  }
  glossarySearchQuery = "";
  glossaryHighlightId = highlightId || null;
  state.screen = "glossary";
  render();
}

function closeGlossary(){
  state.screen = glossaryReturnScreen || "start";
  render();
  scrollTop();
}

function toggleGlossary(){
  if(state.screen === "glossary"){
    closeGlossary();
  } else {
    openGlossary();
  }
}

        <div class="admin-error" id="admin-pin-error"></div>
        <div class="admin-modal-actions">
          <button class="btn outline" onclick="closeAdminOverlay()">${t("adminPinCancel")}</button>
          <button class="btn accent" onclick="submitAdminPin()">${t("adminPinSubmit")}</button>
        </div>
      </div>
    </div>
  `;
  const input = document.getElementById("admin-pin-input");
  input.focus();
  input.addEventListener("keydown", (e) => { if(e.key === "Enter") submitAdminPin(); });
}

function submitAdminPin(){
  const input = document.getElementById("admin-pin-input");
  if(input.value === CONFIG.adminPin){
    adminUnlocked = true;
    try{ localStorage.setItem(ADMIN_STORAGE_KEY, "1"); }catch(e){}
    openAdminPanel();
  } else {
    document.getElementById("admin-pin-error").textContent = t("adminPinError");
    input.value = "";
    input.focus();
  }
}

function adminLockOut(){
  adminUnlocked = false;
  try{ localStorage.removeItem(ADMIN_STORAGE_KEY); }catch(e){}
  closeAdminOverlay();
}

  const mods = modules();
  let itemsHtml = `
    <div class="admin-section-label">${t("adminSectionCourse")}</div>
    <div class="admin-nav-list">
      <button class="admin-nav-item" onclick="adminJumpTo('start')">${t("adminStart")}</button>

      <div class="admin-nav-list">
        <button class="admin-nav-item" onclick="adminJumpTo('module', ${i})">${t("adminModuleContent")}</button>
        <button class="admin-nav-item" onclick="adminJumpTo('quiz', ${i})">${t("adminModuleQuiz")}</button>
        <button class="admin-nav-item" onclick="adminJumpTo('moduleResult', ${i})">${t("adminModuleReview")}</button>
      </div>
    `;
  });
  itemsHtml += `
    <div class="admin-section-label">${escapeHtml(t("finalQuizStepLabel"))}</div>
    <div class="admin-nav-list">
      <button class="admin-nav-item" onclick="adminJumpTo('finalQuizIntro')">${t("adminModuleContent")}</button>
      <button class="admin-nav-item" onclick="adminJumpTo('finalQuiz')">${t("adminModuleQuiz")}</button>
      <button class="admin-nav-item" onclick="adminJumpTo('finalQuizResult')">${t("adminModuleReview")}</button>
    </div>
  `;
  itemsHtml += `
    <div class="admin-section-label">${t("adminSectionOther")}</div>
    <div class="admin-nav-list">
      <button class="admin-nav-item" onclick="adminJumpTo('final')">${t("adminFinal")}</button>
      <button class="admin-nav-item" onclick="adminJumpTo('certificate')">${t("adminCertificate")}</button>
      <button class="admin-nav-item" onclick="adminJumpTo('glossary')">${t("adminGlossaryLink")}</button>
    </div>
  `;
  itemsHtml += `
    <div class="admin-section-label">${t("adminSectionArchive")}</div>
    <div class="admin-nav-list">
      <button class="admin-nav-item" onclick="openAdminCertGenForm()">${t("adminCertGenLink")}</button>
    </div>
  `;

  document.getElementById("admin-root").innerHTML = `
    <div class="admin-backdrop" onclick="if(event.target===this) closeAdminOverlay()">
      <div class="admin-modal admin-panel-modal" role="dialog" aria-modal="true" aria-labelledby="admin-panel-title">
        <h2 id="admin-panel-title">${t("adminPanelTitle")}</h2>
        <p class="subtitle">${t("adminPanelIntro")}</p>
        ${itemsHtml}
        <div class="admin-modal-actions">
          <button class="btn outline" onclick="adminLockOut()">${t("adminLockBtn")}</button>
          <button class="btn accent" onclick="closeAdminOverlay()">${t("adminClose")}</button>
        </div>
      </div>
    </div>
  `;
}

function openAdminCertGenForm(){
  const mods = modules();
  const moduleFieldsHtml = mods.map((m, i) => `
    <div class="admin-form-field">
      <label for="certgen-mod${i}">${escapeHtml(m.title)}${t("certGenScoreSuffix")}</label>
      <input type="text" id="certgen-mod${i}" placeholder="4/5">
    </div>
  `).join("");

  document.getElementById("admin-root").innerHTML = `
    <div class="admin-backdrop" onclick="if(event.target===this) closeAdminOverlay()">
      <div class="admin-modal admin-panel-modal" role="dialog" aria-modal="true" aria-labelledby="certgen-title">
        <h2 id="certgen-title">${t("certGenTitle")}</h2>
        <p class="subtitle">${t("certGenIntro")}</p>
        <div class="admin-form-field">
          <label for="certgen-name">${t("certGenNameLabel")}</label>
          <input type="text" id="certgen-name">
        </div>
        <div class="admin-form-grid">
          <div class="admin-form-field">
            <label for="certgen-date">${t("certGenDateLabel")}</label>
            <input type="date" id="certgen-date">
          </div>
          <div class="admin-form-field">
            <label for="certgen-lang">${t("certGenLangLabel")}</label>
            <select id="certgen-lang">
              <option value="sv">Svenska</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
        <div class="admin-form-field">
          <label for="certgen-certno">${t("certGenCertNoLabel")}</label>
          <input type="text" id="certgen-certno" placeholder="ESD-20260910-1234">
        </div>
        ${moduleFieldsHtml}
        <div class="admin-form-field">
          <label for="certgen-final">${escapeHtml(t("finalQuizStepLabel"))}${t("certGenScoreSuffix")}</label>
          <input type="text" id="certgen-final" placeholder="7/8">
        </div>
        <div class="admin-error" id="certgen-error"></div>
        <div class="admin-modal-actions">
          <button class="btn outline" onclick="openAdminPanel()">${t("adminPinCancel")}</button>
          <button class="btn accent" onclick="submitAdminCertGen()">${t("certGenSubmitBtn")}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById("certgen-lang").value = state.lang;
  document.getElementById("certgen-name").focus();
}

function parseAdminCertGenScore(id){
  const el = document.getElementById(id);
  const v = (el.value || "").trim();
  const match = v.match(/^(\d+)\s*\/\s*(\d+)$/);
  if(!match) return null;
  const score = parseInt(match[1], 10);
  const total = parseInt(match[2], 10);
  if(total <= 0 || score < 0 || score > total) return null;
  return { score, total, passed: (score / total) >= CONFIG.passThreshold, attempts: 1 };
}

function submitAdminCertGen(){
  const mods = modules();
  const name = document.getElementById("certgen-name").value.trim();
  const dateVal = document.getElementById("certgen-date").value;
  const lang = document.getElementById("certgen-lang").value;
  const certNoInput = document.getElementById("certgen-certno").value.trim();
  const moduleResults = mods.map((m, i) => parseAdminCertGenScore(`certgen-mod${i}`));
  const finalResult = parseAdminCertGenScore("certgen-final");

  if(!name || !dateVal || moduleResults.some((r) => !r) || !finalResult){
    document.getElementById("certgen-error").textContent = t("certGenError");
    return;
  }

  stopSpeech();
  state.name = name;
  state.lang = lang;
  state.completedAt = new Date(dateVal + "T10:00:00.000Z").toISOString();
  state.certNumberOverride = certNoInput || null;
  state.moduleResults = moduleResults;
  state.finalQuizResult = finalResult;
  state.finalQuizDetail = [];
  state.lastAttemptDetail = [];
  state.screen = "certificate";

  closeAdminOverlay();
  render();
  scrollTop();
}

function synthesizeModuleResult(moduleIndex){
  // Builds a real quiz shape (same random subset a learner would get) and simulates one
  // attempt. Only question #2 is deliberately marked "wrong" so the reviewer sees one
  // wrong-answer explanation in context, while the module still ends up passed (matches
  // the real, normal outcome).
  const mod = modules()[moduleIndex];
  const quiz = buildQuizOrder(moduleIndex);
  const detail = quiz.questionOrder.map((qi, pos) => {
    const q = mod.questions[qi];
    const pickWrong = pos === 1 && q.options.length > 1;
    const selectedIndex = pickWrong ? (q.correct + 1) % q.options.length : q.correct;
    const isCorrect = selectedIndex === q.correct;
    return {
      text: q.text,
      yourAnswer: q.options[selectedIndex],
      correctAnswer: q.options[q.correct],
      isCorrect,
      explanation: q.explanation,
      wrongNote: (!isCorrect && q.notes) ? q.notes[selectedIndex] : ""
    };
  });
  const score = detail.filter((d) => d.isCorrect).length;
  const total = detail.length;
  const passed = (score / total) >= CONFIG.passThreshold;
  return { score, total, passed, attempts: 1, detail };
}

function synthesizeFinalQuizResult(){
  // Mirrors synthesizeModuleResult(), but for the mixed final quiz spanning all modules.
  const quiz = buildFinalQuizOrder();
  const detail = quiz.questionOrder.map((ref, pos) => {
    const q = modules()[ref.mi].questions[ref.qi];
    const pickWrong = pos === 1 && q.options.length > 1;
    const selectedIndex = pickWrong ? (q.correct + 1) % q.options.length : q.correct;
    const isCorrect = selectedIndex === q.correct;
    return {
      text: q.text,
      moduleIndex: ref.mi,
      yourAnswer: q.options[selectedIndex],
      correctAnswer: q.options[q.correct],
      isCorrect,
      explanation: q.explanation,
      wrongNote: (!isCorrect && q.notes) ? q.notes[selectedIndex] : ""
    };
  });
  const score = detail.filter((d) => d.isCorrect).length;
  const total = detail.length;
  const passed = (score / total) >= CONFIG.passThreshold;
  return { score, total, passed, attempts: 1, detail };
}

function adminJumpTo(target, moduleIndex){
  stopSpeech();
  closeAdminOverlay();

  if(target === "glossary"){
    openGlossary();
    return;
  }

  if(target === "start"){
    state.screen = "start";
  } else if(target === "module"){
    state.currentModuleIndex = moduleIndex;
    state.screen = "module";
  } else if(target === "quiz"){
    state.currentModuleIndex = moduleIndex;
    state.currentQuiz = buildQuizOrder(moduleIndex);
    state.currentQuizAnswers = {};
    state.currentMsg = "";
    state.screen = "quiz";
  } else if(target === "moduleResult"){
    const result = synthesizeModuleResult(moduleIndex);
    state.currentModuleIndex = moduleIndex;
    state.moduleResults[moduleIndex] = { score: result.score, total: result.total, passed: result.passed, attempts: result.attempts };
    state.lastAttemptDetail = result.detail;
    state.screen = "moduleResult";
  } else if(target === "finalQuizIntro"){
    state.screen = "finalQuizIntro";
  } else if(target === "finalQuiz"){
    state.finalQuiz = buildFinalQuizOrder();
    state.finalQuizAnswers = {};
    state.currentMsg = "";
    state.screen = "finalQuiz";
  } else if(target === "finalQuizResult"){
    const result = synthesizeFinalQuizResult();
    state.finalQuizResult = { score: result.score, total: result.total, passed: result.passed, attempts: result.attempts };
    state.finalQuizDetail = result.detail;
    state.screen = "finalQuizResult";
  } else if(target === "final" || target === "certificate"){
    state.moduleResults = modules().map((m, i) => {
      const r = synthesizeModuleResult(i);
      return { score: r.score, total: r.total, passed: r.passed, attempts: r.attempts };
    });
    const fq = synthesizeFinalQuizResult();
    state.finalQuizResult = { score: fq.score, total: fq.total, passed: fq.passed, attempts: fq.attempts };
    state.finalQuizDetail = fq.detail;
    if(!state.name) state.name = t("adminPreviewName");
    state.completedAt = state.completedAt || new Date().toISOString();
    state.certNumberOverride = null;
    state.screen = target;
  }

  render();
  scrollTop();
}

function filterGlossary(query){
  glossarySearchQuery = query;
  renderGlossary();
}

function renderGlossary(){
  const q = glossarySearchQuery.trim().toLowerCase();
  const highlightId = glossaryHighlightId;
  glossaryHighlightId = null;
  const allTerms = GLOSSARY[state.lang];
  const entries = allTerms
    .filter(e => !q || e.term.toLowerCase().includes(q) || e.def.toLowerCase().includes(q))
    .sort((a, b) => a.term.localeCompare(b.term, state.lang));

  const countText = q
    ? t("glossaryCountFiltered", { n: entries.length, total: allTerms.length })
    : t("glossaryCountAll", { n: allTerms.length });

  let lastLetter = null;
  const listParts = [];
  entries.forEach(e => {
    const letter = e.term.charAt(0).toUpperCase();
    if(letter !== lastLetter){
      listParts.push(`<div class="glossary-letter">${escapeHtml(letter)}</div>`);
      lastLetter = letter;
    }
    listParts.push(`
      <div class="glossary-entry${e.id === highlightId ? " highlight" : ""}" id="glossary-entry-${e.id}">
        <h3>${escapeHtml(e.term)}</h3>
        <p>${escapeHtml(e.def)}</p>
      </div>
    `);
  });
  const list = entries.length ? listParts.join("") : `<p class="subtitle">${t("glossaryNoResults")}</p>`;

  app.innerHTML = `
    <div class="card">
      <h2><span class="module-icon">${icon("book")}</span>${t("glossaryTitle")}</h2>
      <p class="subtitle">${t("glossaryIntro")}</p>
      <div class="glossary-search">
        ${icon("search")}
        <input type="text" id="glossary-search-input" placeholder="${t("glossarySearchPlaceholder")}" value="${escapeHtml(glossarySearchQuery)}" oninput="filterGlossary(this.value)">
        ${glossarySearchQuery ? `<button type="button" class="glossary-clear-btn" onclick="filterGlossary('')" aria-label="${escapeHtml(t("glossaryClearSearch"))}">${icon("close")}</button>` : ""}
      </div>
      <p class="glossary-count">${countText}</p>
      <div class="glossary-list" id="glossary-list">${list}</div>
      <div class="btn-row">
        <button class="btn outline" onclick="closeGlossary()">${t("backBtn")}</button>
      </div>
    </div>
  `;
  if(highlightId){
    const target = document.getElementById("glossary-entry-" + highlightId);
    if(target) target.scrollIntoView({ block: "center" });
  } else {
    const input = document.getElementById("glossary-search-input");
    if(input){
      const pos = input.value.length;
      input.focus();
      input.setSelectionRange(pos, pos);
    }
  }
}

  }
  try{ adminUnlocked = localStorage.getItem(ADMIN_STORAGE_KEY) === "1"; }catch(e){}

})();
